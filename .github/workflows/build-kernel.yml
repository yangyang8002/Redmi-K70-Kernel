name: Build Redmi K70 Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'MiCode kernel source branch (Redmi K70 = bsp-vermeer-t-oss)'
        required: true
        default: 'bsp-vermeer-t-oss'
        type: string
      toolchain:
        description: 'Compiler toolchain (auto: AOSP prebuilt clang, fallback apt clang)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - aosp
          - apt
      lto:
        description: 'LTO mode (thin: lower memory/build time; official gki_defconfig uses full)'
        required: false
        default: 'thin'
        type: choice
        options:
          - thin
          - full
          - none
      build_targets:
        description: 'make targets (official: Image modules; or split rounds: Image / modules)'
        required: false
        default: 'Image modules'
        type: string
  push:
    branches: [ main ]

concurrency:
  group: build-Redmi-K70-Kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  KERNEL_BRANCH: ${{ inputs.kernel_branch || 'bsp-vermeer-t-oss' }}
  MERGED_DEFCONFIG: vendor/vermeer-gki_defconfig
  GKI_FRAGMENT: arch/arm64/configs/gki_defconfig
  VERMEER_FRAGMENT: arch/arm64/configs/vendor/vermeer_GKI.config
  AOSP_CLANG_VERSION: r450784e
  BUILD_TARGETS: ${{ inputs.build_targets || 'Image modules' }}

jobs:
  build:
    name: Build official vermeer kernel
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize runner disk space
        run: |
          set -e
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies (baseline apt clang included)
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio zip unzip curl wget git \
            libssl-dev libelf-dev libncurses-dev \
            zstd lz4 lzop u-boot-tools kmod dwarves \
            python3 python-is-python3 clang lld llvm
          echo "=== baseline (apt) toolchain ==="
          clang --version | head -n1
          ld.lld --version | head -n1

      - name: Clone official Xiaomi kernel source (MiCode)
        run: |
          set -e
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          echo "=== HEAD commit ==="
          git -C kernel log -1 --format='%H%n%s'
          echo "=== kernel version ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) *=' kernel/Makefile

      - name: Patch dangling Kconfig sources (Xiaomi OSS tree quirks)
        run: |
          set -e
          cd kernel
          # Xiaomi's OSS release strips some components (e.g. drivers/misc/hwid)
          # but leaves their "source" statements behind -> kconfig fails to parse.
          # Only touch real statements: quoted path, no $(VAR) expansion, target actually missing.
          removed=0
          while IFS= read -r -d '' f; do
            rel_dir="$(dirname "$f")"
            changed=0
            : > "$f.tmpfix"
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ "$line" =~ ^(o|r|or)?source[[:space:]]+\"([^\"]+)\" ]]; then
                kind="${BASH_REMATCH[1]}"
                p="${BASH_REMATCH[2]}"
                case "$p" in
                  *'$('*) printf '%s\n' "$line" >> "$f.tmpfix"; continue ;;
                esac
                if [ "$kind" = r ] || [ "$kind" = or ]; then
                  test_p="$rel_dir/$p"
                else
                  test_p="$p"
                fi
                if [ ! -e "$test_p" ]; then
                  echo "NOTE: removing dangling Kconfig source: $line (in $f)"
                  removed=$((removed+1))
                  changed=1
                  continue
                fi
              fi
              printf '%s\n' "$line" >> "$f.tmpfix"
            done < "$f"
            if [ "$changed" = 1 ]; then mv "$f.tmpfix" "$f"; else rm -f "$f.tmpfix"; fi
          done < <(find . -name 'Kconfig*' -type f -not -path './scripts/kconfig/tests/*' -print0)
          echo "dangling Kconfig sources removed: $removed"

      - name: Stub the stripped drivers/misc/hwid/hwid.h header
        run: |
          set -e
          cd kernel
          # Xiaomi's OSS release strips drivers/misc/hwid/ entirely, but
          # drivers/usb/repeater/repeater-qti-pmic-eusb2.c still includes its
          # header and calls get_hw_version_platform()/get_hw_country_version().
          # Stub them to return values that match no real project/country, so
          # the eUSB2 repeater driver takes the standard qcom,param-override-seq
          # tuning path from DT (ms scheme disabled).
          mkdir -p drivers/misc/hwid
          cat > drivers/misc/hwid/hwid.h <<'EOF'
          /* Stub for the stripped drivers/misc/hwid/ (Xiaomi OSS tree quirk). */
          #ifndef _HWID_STUB_H
          #define _HWID_STUB_H

          enum country_version_stub {
              CountryCN = 100,
          };

          enum hardware_project_stub {
              HARDWARE_PROJECT_M2 = 101,
              HARDWARE_PROJECT_M3 = 102,
              HARDWARE_PROJECT_N11 = 103,
          };

          static inline int get_hw_version_platform(void) { return -1; }
          static inline int get_hw_country_version(void) { return -1; }

          #endif /* _HWID_STUB_H */
          EOF
          echo "created stub drivers/misc/hwid/hwid.h"

      - name: Commit tree fixes for a clean vermagic
        run: |
          set -e
          cd kernel
          # The Kconfig patches + hwid.h stub make setlocalversion append
          # "-dirty" (with the -g<sha> warning prefix, e.g.
          # 5.15.78-g53ef33eacdc4-dirty) to the kernel release. Committing the
          # fixes gives exactly what the official build produces from a clean
          # checkout of this OSS tree: the plain release "5.15.78", so every
          # built module carries the same vermagic as the official clean build.
          printf 'out/\nbuild.log\n' >> .gitignore
          git add -A
          git -c user.email=ci@localhost -c user.name=ci commit -q -m 'CI: OSS tree fixes (dangling Kconfig source, hwid stub)' || true
          git log --oneline -2

      - name: Set up AOSP prebuilt clang (official toolchain pinned by the kernel tree)
        env:
          TOOLCHAIN_MODE: ${{ inputs.toolchain || 'auto' }}
        run: |
          set -e
          if [ "$TOOLCHAIN_MODE" = "apt" ]; then
            echo "toolchain=apt requested, skipping AOSP prebuilt download."
            echo "USING_TOOLCHAIN=apt clang ($(clang --version | head -n1))" >> "$GITHUB_ENV"
            exit 0
          fi
          ok=0
          for ref in main-kernel-build-2022 main-kernel-build-2023 main-kernel-build-2024 master; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${ref}/clang-${AOSP_CLANG_VERSION}.tar.gz"
            echo "Trying $url"
            if curl -fsSL --retry 2 --connect-timeout 20 --max-time 900 -o /tmp/aosp-clang.tar.gz "$url" \
               && tar -tzf /tmp/aosp-clang.tar.gz >/dev/null 2>&1; then
              mkdir -p "$GITHUB_WORKSPACE/aosp-clang"
              tar -xzf /tmp/aosp-clang.tar.gz -C "$GITHUB_WORKSPACE/aosp-clang"
              if [ -x "$GITHUB_WORKSPACE/aosp-clang/bin/clang" ]; then
                echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
                echo "USING_TOOLCHAIN=AOSP prebuilt clang ${AOSP_CLANG_VERSION} (from ${ref})" >> "$GITHUB_ENV"
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" != "1" ]; then
            if [ "$TOOLCHAIN_MODE" = "aosp" ]; then
              echo "ERROR: toolchain=aosp requested but AOSP prebuilt could not be downloaded."
              exit 1
            fi
            echo "AOSP prebuilt unavailable, falling back to apt clang."
            echo "USING_TOOLCHAIN=apt clang ($(clang --version | head -n1))" >> "$GITHUB_ENV"
          fi

      - name: Show active toolchain
        run: |
          which clang ld.lld
          clang --version | head -n1
          echo "toolchain: $USING_TOOLCHAIN"

      - name: Merge GKI + vermeer vendor config fragments (official Qualcomm flow)
        run: |
          set -e
          cd kernel
          # Mirrors build.config.msm.gki (VARIANT=gki): apply_defconfig_fragment() +
          # merge_defconfig_fragments() -> merge gki_defconfig + vendor/vermeer_GKI.config
          # into arch/arm64/configs/vendor/vermeer-gki_defconfig
          KCONFIG_CONFIG="$PWD/arch/arm64/configs/$MERGED_DEFCONFIG" \
            ./scripts/kconfig/merge_config.sh -m -r -y "$GKI_FRAGMENT" "$VERMEER_FRAGMENT"
          echo "=== merged defconfig: $MERGED_DEFCONFIG ==="
          grep -c '^CONFIG' "arch/arm64/configs/$MERGED_DEFCONFIG"

      - name: Restore kernel build tree cache (resumable rounds)
        id: outcache
        uses: actions/cache/restore@v4
        with:
          path: kernel/out
          key: k70-out-${{ env.KERNEL_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            k70-out-${{ env.KERNEL_BRANCH }}-

      - name: Generate .config
        run: |
          set -e
          cd kernel
          # On resume rounds a complete out/ (incl. .config) is restored from cache:
          # keep it untouched so make does not re-run syncconfig / rebuild the world.
          config_sane() {
            [ -f out/.config ] || return 1
            for sym in CONFIG_ARM64 CONFIG_MMU CONFIG_MODULES CONFIG_DRM; do
              grep -q "^${sym}=y" out/.config || return 1
            done
            return 0
          }
          if config_sane; then
            echo "sane out/.config restored from build cache - keeping it as-is for incremental resume"
          else
            make O=out ARCH=arm64 LLVM=1 "$MERGED_DEFCONFIG" < /dev/null
          fi
          echo "=== config sanity ==="
          if ! config_sane; then
            echo "ERROR: .config is missing critical symbols - Kconfig parse is broken"
            grep -E '^(CONFIG_ARM64|CONFIG_MMU|CONFIG_MODULES|CONFIG_DRM|CONFIG_LTO_CLANG)' out/.config || true
            exit 1
          fi
          entries=$(grep -c '^CONFIG' out/.config || true)
          echo "config entries (enabled): $entries"
          if [ "$entries" -lt 1500 ]; then
            echo "ERROR: .config suspiciously small ($entries enabled entries) - Kconfig parse is broken"
            exit 1
          fi
          echo "=== kernel release ==="
          make O=out ARCH=arm64 LLVM=1 kernelrelease < /dev/null
          echo "=== notable options ==="
          grep -E 'CONFIG_(LTO|CFI|SHADOW_CALL_STACK|MODVERSIONS|MODULE_SIG|WERROR|DEBUG_INFO_BTF)' out/.config | grep -v 'is not set' || true

      - name: 'Apply LTO mode (default ThinLTO) and turn off WERROR'
        env:
          LTO_MODE: ${{ inputs.lto || 'thin' }}
        run: |
          set -e
          cd kernel
          echo "Requested LTO mode: $LTO_MODE"
          case "$LTO_MODE" in
            thin) want="CONFIG_LTO_CLANG_THIN=y" ;;
            full) want="CONFIG_LTO_CLANG_FULL=y" ;;
            none) want="CONFIG_LTO_NONE=y" ;;
          esac
          # GKI forces CONFIG_WERROR=y, but the apt clang fallback is newer than the
          # official clang r450784e and rejects some legacy C code in this tree
          # (e.g. drivers/soc/qcom/minidump_log.c implicit-int) - keep those as warnings.
          werror_off=0
          grep -q '^# CONFIG_WERROR is not set' out/.config && werror_off=1
          if grep -q "^$want$" out/.config && [ "$werror_off" = 1 ]; then
            echo "$want set and WERROR off already - no config rewrite needed"
          else
            ./scripts/config --file out/.config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -d LTO_NONE
            ./scripts/config --file out/.config -e ${want%%=*}
            ./scripts/config --file out/.config -d WERROR
            make O=out ARCH=arm64 LLVM=1 olddefconfig < /dev/null
          fi
          echo "=== LTO + WERROR settings in final config ==="
          grep -E 'CONFIG_LTO|CONFIG_WERROR' out/.config || true
          if [ "$LTO_MODE" = "thin" ] && ! grep -q 'CONFIG_LTO_CLANG_THIN=y' out/.config; then
            echo "ERROR: ThinLTO was not enabled in final config"
            exit 1
          fi

      - name: Build kernel
        timeout-minutes: 270
        run: |
          set -eo pipefail
          cd kernel
          # Make all sources older than any restored out/ objects so make resumes instead of rebuilding
          # (non-fatal: broken symlinks like Documentation/devicetree/bindings must not abort)
          find . -not -path './out*' -exec touch -d @0 {} + 2>/dev/null || true
          # The GKI top-level Makefile hardcodes -Werror= for several legacy C
          # warning classes; newer apt clang (18) detects more in this tree than
          # the official clang r450784e (e.g. minidump_log.c implicit-int,
          # mi_power.c strict-prototypes). KCFLAGS is appended after KBUILD_CFLAGS
          # so it overrides them all (downgrade to warnings, still printed).
          # NOTE: only clang-known classes may appear here - a -Wno-error= for a
          # class clang does not know (designated-init is GCC-only) makes the
          # Makefile's cc-option probe keep that flag and clang errors out.
          # Never let make (or stray tools like a bare bc call in this tree) block on stdin
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 \
               KCFLAGS='-Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=date-time -Wno-error=incompatible-pointer-types' \
               $BUILD_TARGETS < /dev/null 2>&1 | tee -a build.log
          echo "=== build output ==="
          ls -lh out/arch/arm64/boot/Image 2>/dev/null || true
          file out/arch/arm64/boot/Image 2>/dev/null | head -n1 || true
          echo "=== modules built ==="
          find out -name '*.ko' 2>/dev/null | wc -l

      - name: Save kernel build tree cache (resume on timeout)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: kernel/out
          key: k70-out-${{ env.KERNEL_BRANCH }}-${{ github.run_id }}

      - name: Stage modules (modules_install + depmod)
        run: |
          set -e
          cd kernel
          make O=out ARCH=arm64 LLVM=1 INSTALL_MOD_PATH="$GITHUB_WORKSPACE/artifacts/modules" modules_install < /dev/null
          echo "=== staged modules ==="
          find "$GITHUB_WORKSPACE/artifacts/modules/lib/modules" -name '*.ko' | wc -l

      - name: Package boot, init_boot and vendor_boot images (mkbootimg)
        run: |
          set -eo pipefail
          cd kernel
          A="$GITHUB_WORKSPACE/artifacts"
          STOCK="$GITHUB_WORKSPACE/stock"
          MK="$RUNNER_TEMP/mkbootimg.py"
          UN="$RUNNER_TEMP/unpack_bootimg.py"

          # ---- official AOSP packaging tools (single-file, base64) ----
          curl -fsSL --retry 3 'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/mkbootimg.py?format=TEXT' | base64 -d > "$MK"
          curl -fsSL --retry 3 'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/unpack_bootimg.py?format=TEXT' | base64 -d > "$UN"
          # Unsigned images: drop the GKI certificate import (needs an AOSP
          # module that is not shipped with the single file).
          sed -i '/from gki.generate_gki_certificate import/d' "$MK"
          python3 "$MK" --help > /dev/null && echo "mkbootimg ready"

          # ---- kernel release + staged modules ----
          # modules_install stages the tree as lib/modules/<UTS_RELEASE>/kernel/...
          # Use the actual staged directory name (authoritative UTS_RELEASE).
          STAGE_BASE="$A/modules/lib/modules"
          KVER="$(ls "$STAGE_BASE" | head -n1)"
          STAGE="$STAGE_BASE/$KVER"
          echo "kernel release: $KVER"
          test -n "$KVER" && test -d "$STAGE"

          # ---- vendor ramdisk: official first-stage module lists ----
          # Official flow (build.config.msm.common): vendor_boot ramdisk holds
          # the modules of SYSTEM_DLKM_MODULES_LIST (gki_system_dlkm_modules)
          # plus modules.list.msm.vermeer; everything else goes to vendor_dlkm.
          # Both official lists use plain module basenames; so does modules.load.
          {
            awk -F'/' '{print $NF}' android/gki_system_dlkm_modules | grep -v '^#' || true
            grep -v '^#' modules.list.msm.vermeer || true
          } | sort -u > "$RUNNER_TEMP/official.list"
          # staged .ko files live under kernel/... subdirs; collect basenames
          find "$STAGE" -name '*.ko' -printf '%f\n' | sort -u > "$RUNNER_TEMP/built.list" || true
          VRD="$RUNNER_TEMP/vramdisk"
          VDEST="$VRD/lib/modules/$KVER"
          VD="$RUNNER_TEMP/vdlkm"
          mkdir -p "$VDEST" "$VD/lib/modules/$KVER"
          comm -12 "$RUNNER_TEMP/official.list" "$RUNNER_TEMP/built.list" > "$VDEST/modules.load"
          comm -13 "$RUNNER_TEMP/official.list" "$RUNNER_TEMP/built.list" > "$RUNNER_TEMP/vendor_dlkm.list"
          echo "vendor_boot modules.load: $(wc -l < "$VDEST/modules.load") entries"
          echo "vendor_dlkm modules: $(wc -l < "$RUNNER_TEMP/vendor_dlkm.list")"
          # vendor ramdisk lays modules out flat in lib/modules/$KVER/ (GKI layout)
          find "$STAGE" -name '*.ko' -print0 | while IFS= read -r -d '' p; do
            b="$(basename "$p")"
            if grep -qx "$b" "$VDEST/modules.load"; then cp -f "$p" "$VDEST/$b"; fi
            if grep -qx "$b" "$RUNNER_TEMP/vendor_dlkm.list"; then cp -f "$p" "$VD/lib/modules/$KVER/$b"; fi
          done
          cp "$STAGE/modules.builtin" "$VDEST/" 2>/dev/null || true
          sed -n 's/^blocklist //p' modules.vendor_blocklist.msm.vermeer > "$VDEST/modules.blocklist" || true
          depmod -b "$VRD" "$KVER"
          (cd "$VRD" && find . -print0 | cpio --null -o -H newc --quiet | gzip -9) > "$A/vendor_ramdisk.cpio.gz"
          cp "$RUNNER_TEMP/vendor_dlkm.list" "$VD/vendor_dlkm.modules.load"
          tar -czf "$A/vendor_dlkm-modules.tar.gz" -C "$VD" .
          cp "$VDEST/modules.load" "$A/vendor_boot.modules.load"

          # ---- optional stock images from the repo 'stock/' directory ----
          DTB_ARGS=""
          DTB_NOTE="without dtb"
          if [ -d "$STOCK" ] && [ -f "$STOCK/vendor_boot.img" ]; then
            mkdir -p "$RUNNER_TEMP/unpack_vboot"
            python3 "$UN" --vendor_boot "$STOCK/vendor_boot.img" --out "$RUNNER_TEMP/unpack_vboot" || true
            DTB="$(find "$RUNNER_TEMP/unpack_vboot" -name '*.dtb' | head -n1)"
            BC="$(find "$RUNNER_TEMP/unpack_vboot" -name 'bootconfig*' | head -n1)"
            if [ -n "$DTB" ]; then
              DTB_ARGS="--dtb $DTB"
              DTB_NOTE="with stock dtb"
            fi
            if [ -n "$BC" ]; then
              DTB_ARGS="$DTB_ARGS --vendor_bootconfig $BC"
              DTB_NOTE="$DTB_NOTE + bootconfig"
            fi
          fi

          # ---- boot.img (header v4, official parameters) ----
          # BOOT_IMAGE_HEADER_VERSION=4 / BASE_ADDRESS=0x80000000 / PAGE_SIZE=4096
          # from build.config.msm.vermeer; GKI boot v4 cmdline is empty.
          # Unsigned (no GKI boot_signature - not available without Google's
          # certification key; flash with AVB verification disabled).
          python3 "$MK" --header_version 4 \
            --kernel out/arch/arm64/boot/Image \
            --cmdline "" \
            --base 0x80000000 \
            --pagesize 4096 \
            --os_version 14.0.0 --os_patch_level 2024-06 \
            -o "$A/boot.img"

          # ---- vendor_boot.img (header v4, official cmdline) ----
          # KERNEL_VENDOR_CMDLINE from build.config.msm.vermeer (gki variant).
          python3 "$MK" --header_version 4 \
            --vendor_boot "$A/vendor_boot.img" \
            --vendor_ramdisk "$A/vendor_ramdisk.cpio.gz" \
            --vendor_cmdline "console=ttyMSM0,115200n8 earlycon=qcom_geni,0x00a9C000 qcom_geni_serial.con_enabled=1 nosoftlockup bootconfig" \
            --base 0x80000000 \
            --pagesize 4096 \
            --board android \
            $DTB_ARGS
          echo "vendor_boot packed: $DTB_NOTE"

          # ---- init_boot.img: stock pass-through when provided ----
          # The generic ramdisk contains AOSP userspace (init binary etc.) and
          # is NOT part of the kernel source tree; it is reused unchanged.
          # This build's release string (5.15.78, clean tree) matches what the
          # official OSS-tree build produces; if the shipped init_boot carries
          # a different vermagic, its GKI modules must be repacked from this
          # build instead of passing the stock image through.
          if [ -f "$STOCK/init_boot.img" ]; then
            cp "$STOCK/init_boot.img" "$A/init_boot.img"
            echo "stock init_boot.img included (pass-through)"
          else
            echo "NOTE: init_boot.img not packed - provide stock/init_boot.img (from the official OTA payload) and rerun; the stock image is compatible as-is with this kernel."
          fi

      - name: Collect artifacts
        env:
          LTO_MODE: ${{ inputs.lto || 'thin' }}
        run: |
          set -e
          cd kernel
          A="$GITHUB_WORKSPACE/artifacts"
          # The staged kernel.release (fixed at compile time) is authoritative;
          # re-running "make kernelrelease" would re-trigger setlocalversion and
          # can pick up a spurious -g<sha> stat-dirty suffix from the epoch touch.
          RELEASE="$(cat out/include/config/kernel.release)"
          mkdir -p "$A/boot"
          cp out/arch/arm64/boot/Image "$A/boot/"
          cp out/System.map "$A/boot/" 2>/dev/null || true
          cp out/Module.symvers "$A/" 2>/dev/null || true
          cp out/modules.builtin "$A/" 2>/dev/null || true
          cp out/modules.builtin.modinfo "$A/" 2>/dev/null || true
          cp out/.config "$A/kernel.config"
          cp "arch/arm64/configs/$MERGED_DEFCONFIG" "$A/merged-defconfig"
          cp build.log "$A/" 2>/dev/null || true
          {
            echo "Redmi K70 (vermeer) - official Xiaomi kernel source build"
            echo "===================================================="
            echo "build date (UTC) : $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "kernel source   : $KERNEL_REPO"
            echo "branch          : $KERNEL_BRANCH"
            echo "source commit   : $(git rev-parse HEAD~1) (upstream MiCode)"
            echo "ci fix commit   : $(git log -1 --format='%h %s')"
            echo "kernel release  : $RELEASE"
            echo "toolchain       : $USING_TOOLCHAIN"
            echo "lto mode        : $LTO_MODE"
            echo "werror          : disabled + KCFLAGS -Wno-error=implicit-int (newer clang compatibility)"
            echo "hwid.h          : stubbed (drivers/misc/hwid/ stripped from OSS tree)"
            echo "boot image      : boot.img (v4, official params, unsigned - no GKI boot_signature)"
            echo "vendor_boot     : vendor_boot.img (v4, official cmdline, official module lists; dtb only when stock/vendor_boot.img is provided - DTS is stripped from the OSS tree)"
            echo "init_boot       : pass-through stock/init_boot.img when provided (generic ramdisk is AOSP userspace; release string matches the official clean OSS build)"
            echo "compiler        : $(clang --version | head -n1)"
            echo "config          : $GKI_FRAGMENT + $VERMEER_FRAGMENT -> $MERGED_DEFCONFIG"
            echo "targets         : $BUILD_TARGETS (official: Image modules per build.config.aarch64)"
          } > "$A/BUILD-INFO.txt"
          tar -czf "$A/modules.tar.gz" -C "$A/modules" .
          rm -rf "$A/modules"
          echo "=== artifacts ==="
          ls -lh "$A"
          df -h /

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redmi-k70-vermeer-kernel
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 7
