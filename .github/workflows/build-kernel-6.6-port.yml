name: Port vermeer vendor drivers to linux-6.6 (stage)

on:
  workflow_dispatch:
    inputs:
      lto:
        description: 'LTO mode'
        required: false
        default: 'none'
        type: choice
        options: [ none, thin, full ]
      keep_going:
        description: 'make -k (collect as many errors as possible)'
        required: false
        default: true
        type: boolean
  push:
    branches: [ linux-6.6-port ]

concurrency:
  group: port-66-${{ github.ref }}
  cancel-in-progress: true

env:
  G66_REPO: https://android.googlesource.com/kernel/common.git
  G66_BRANCH: android15-6.6
  V15_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  V15_BRANCH: bsp-vermeer-t-oss
  VERMEER_FRAGMENT_URL: https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/53ef33eacdc4f7ac737451e4cfc91963d59e3956/arch/arm64/configs/vendor/vermeer_GKI.config

jobs:
  port:
    name: Copy vermeer 5.15 drivers onto GKI 6.6 and build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout port scripts
        uses: actions/checkout@v4

      - name: Maximize runner disk space
        run: |
          set -e
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio zip unzip curl wget git rsync \
            libssl-dev libelf-dev libncurses-dev \
            zstd lz4 lzop u-boot-tools kmod dwarves \
            python3 python-is-python3 clang lld llvm
          clang --version | head -n1

      - name: Clone GKI 6.6 + vermeer 5.15 source trees
        run: |
          set -e
          git clone --depth=1 -b "$G66_BRANCH" "$G66_REPO" kernel
          git clone --depth=1 -b "$V15_BRANCH" "$V15_REPO" vermeer
          echo "=== GKI 6.6 ==="; git -C kernel log -1 --format='%H %s'
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) *=' kernel/Makefile
          echo "=== vermeer 5.15 ==="; git -C vermeer log -1 --format='%H %s'
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) *=' vermeer/Makefile

      - name: Copy vermeer vendor driver stack onto GKI 6.6
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # BSP-only extras are merged with --ignore-existing so upstream 6.6
          # drivers are never clobbered; full-stack dirs (display/camera/wlan)
          # replace their 6.6 counterparts wholesale.
          rsync -a vermeer/drivers/gpu/drm/msm/ kernel/drivers/gpu/drm/msm/
          mkdir -p kernel/drivers/media/platform/msm
          rsync -a vermeer/drivers/media/platform/msm/ kernel/drivers/media/platform/msm/
          rsync -a --ignore-existing vermeer/drivers/soc/qcom/ kernel/drivers/soc/qcom/
          rsync -a --ignore-existing vermeer/drivers/clk/qcom/ kernel/drivers/clk/qcom/
          rsync -a --ignore-existing vermeer/drivers/pinctrl/qcom/ kernel/drivers/pinctrl/qcom/
          rsync -a --ignore-existing vermeer/drivers/interconnect/qcom/ kernel/drivers/interconnect/qcom/
          rsync -a --ignore-existing vermeer/drivers/iommu/ kernel/drivers/iommu/
          rsync -a --ignore-existing vermeer/drivers/remoteproc/ kernel/drivers/remoteproc/
          rsync -a --ignore-existing vermeer/drivers/phy/qualcomm/ kernel/drivers/phy/qualcomm/
          rsync -a --ignore-existing vermeer/drivers/usb/ kernel/drivers/usb/
          rsync -a --ignore-existing vermeer/drivers/net/wireless/vendor/ kernel/drivers/net/wireless/vendor/ 2>/dev/null || true
          for d in drivers/staging/qcacld-3.0 drivers/staging/fw-api; do
            [ -d "vermeer/$d" ] && rsync -a "vermeer/$d/" "kernel/$d/"
          done
          # 5.15 dt-bindings/uapi headers (qcom,ipcc.h etc.) are referenced by
          # the BSP drivers; merge them without clobbering 6.6 headers.
          # asm-generic is excluded: 5.15's asm-generic/termios.h conflicts
          # with 6.6's include/linux/termios_internal.h declarations.
          rsync -a --ignore-existing --exclude='asm-generic/' vermeer/include/ kernel/include/
          test -f kernel/include/dt-bindings/soc/qcom,ipcc.h && echo "qcom,ipcc.h merged"
          echo "=== copied tree stats ==="
          du -sh kernel/drivers/gpu/drm/msm kernel/drivers/media/platform/msm kernel/drivers/soc/qcom 2>/dev/null
          find kernel -name '*.ko' -o -name 'modules.order' | head -n1 >/dev/null || true

      - name: Wire vendor Kconfig/Makefile hooks into the 6.6 tree
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          # display: 6.6 drm/Kconfig already sources msm/Kconfig (upstream), and
          # drm/Makefile already descends into msm/. Verify; add if missing.
          grep -q 'source "drivers/gpu/drm/msm/Kconfig"' drivers/gpu/drm/Kconfig || echo 'source "drivers/gpu/drm/msm/Kconfig"' >> drivers/gpu/drm/Kconfig
          # camera/media: hook msm/ into the platform Kconfig/Makefile
          grep -q 'source "drivers/media/platform/msm/Kconfig"' drivers/media/platform/Kconfig || echo 'source "drivers/media/platform/msm/Kconfig"' >> drivers/media/platform/Kconfig
          grep -q 'obj-y += msm/' drivers/media/platform/Makefile || printf 'obj-y += msm/\n' >> drivers/media/platform/Makefile
          # qcacld: vermeer's drivers/staging/Kconfig/Makefile lines
          for f in Kconfig Makefile; do
            if [ -f "../vermeer/drivers/staging/$f" ]; then
              grep -E 'qcacld|fw-api' "../vermeer/drivers/staging/$f" | while IFS= read -r line; do
                grep -qF "$line" "drivers/staging/$f" || printf '%s\n' "$line" >> "drivers/staging/$f"
              done
            fi
          done
          echo "=== wired hooks ==="
          grep -n 'msm' drivers/media/platform/Kconfig drivers/media/platform/Makefile || true
          grep -n 'qcacld' drivers/staging/Kconfig drivers/staging/Makefile || true
          # Linux 6.6 removed module_refcount(); AOSP's gunyah vm_mgr.c still
          # references it but never rots because GKI keeps GUNYAH=n. The vermeer
          # fragment enables GUNYAH, so drop the stale refcount check.
          sed -i 's/WARN_ON(fn->mod \&\& module_refcount(fn->mod));/WARN_ON(0);/' drivers/virt/gunyah/vm_mgr.c
          grep -n 'WARN_ON(0)' drivers/virt/gunyah/vm_mgr.c
          # 6.4+ removed the owner arg from class_create(): fix every copied
          # 5.15 driver that still calls class_create(THIS_MODULE, "name").
          n=0
          grep -rl 'class_create(THIS_MODULE' drivers/ arch/ 2>/dev/null | while read -r f; do
            sed -i 's/class_create(THIS_MODULE, /class_create(/g' "$f"
            echo "  fixed: $f"
            n=$((n+1))
          done
          echo "class_create fixes applied"
          # The 5.15 BSP hwkm headers include userspace <stdbool.h> /
          # <stddef.h>; the kernel's bool and size_t already come from
          # linux/types.h. Drop such includes.
          for uh in stdbool.h stddef.h stdint.h; do
            grep -rl "#include <$uh>" include/ drivers/ 2>/dev/null | while read -r f; do
              sed -i "/#include <$uh>/d" "$f"
              echo "  dropped $uh from: $f"
            done
          done
          # ... and the same call split across two lines (dcc_v2.c style):
          # class_create(THIS_MODULE,\n "name") - the single-line sed above
          # missed it, so strip the owner arg at end-of-line too.
          grep -rl 'class_create(THIS_MODULE,$' drivers/ arch/ 2>/dev/null | while read -r f; do
            sed -i 's/class_create(THIS_MODULE,$/class_create(/' "$f"
            echo "  multiline class_create fixed: $f"
          done
          # 6.2 made uart_ops.set_termios take a const old termios; fix the
          # 5.15 eud uart driver signature to match.
          sed -i '/eud_set_termios(struct uart_port \*port/,+1 s/struct ktermios \*old)/const struct ktermios *old)/' drivers/soc/qcom/eud.c
          sed -n '393,394p' drivers/soc/qcom/eud.c || true
          # 6.9 made ww_mutex_trylock() take a ww_acquire_ctx too; the 5.15
          # callers pass only the lock. Add NULL for single-arg calls.
          grep -rl 'ww_mutex_trylock(' drivers/ 2>/dev/null | while read -r f; do
            sed -i 's/ww_mutex_trylock(\([^,)]*\))/ww_mutex_trylock(\1, NULL)/g' "$f"
          done
          grep -rn 'ww_mutex_trylock(' drivers/clk/qcom/gdsc-regulator.c | head -n 4 || true
          # 5.15 BSP pinctrl drivers (kalama/crow) need the 5.15 msm_pingroup
          # layout (wake_reg/wake_bit fields), which differs from upstream
          # 6.6's. Give them a private copy of the 5.15 header instead of
          # clobbering the 6.6 one that upstream pinctrl-msm.c still uses.
          cp ../vermeer/drivers/pinctrl/qcom/pinctrl-msm.h drivers/pinctrl/qcom/pinctrl-msm-v15.h
          for f in drivers/pinctrl/qcom/pinctrl-kalama.c drivers/pinctrl/qcom/pinctrl-crow.c; do
            [ -f "$f" ] && sed -i 's/#include "pinctrl-msm.h"/#include "pinctrl-msm-v15.h"/' "$f"
          done
          grep -l 'pinctrl-msm-v15' drivers/pinctrl/qcom/*.c 2>/dev/null || true
          # Same pattern for the 5.15 BSP clock drivers (gcc/camcc/dispcc/
          # tcsrcc/videocc-kalama): they need the 5.15 common.h (vdd_cx,
          # HW_CLK_CTRL_MODE) and clk-debug.h, which differ from upstream's.
          cp ../vermeer/drivers/clk/qcom/common.h drivers/clk/qcom/common-v15.h
          [ -f ../vermeer/drivers/clk/qcom/clk-debug.h ] && cp ../vermeer/drivers/clk/qcom/clk-debug.h drivers/clk/qcom/clk-debug-v15.h
          for f in drivers/clk/qcom/*kalama*.c drivers/clk/qcom/*crow*.c drivers/clk/qcom/clk-debug.c; do
            [ -f "$f" ] || continue
            sed -i 's/#include "common.h"/#include "common-v15.h"/; s/#include "clk-debug.h"/#include "clk-debug-v15.h"/' "$f"
            echo "  clk header rewired: $f"
          done
          # and any other 5.15 BSP .c that made it in and includes common.h
          for f in $(grep -l '#include "common.h"' drivers/clk/qcom/*.c 2>/dev/null); do
            case "$f" in *kalama*|*crow*) continue ;; esac
            grep -qF "vdd_cx" "$f" && { sed -i 's/#include "common.h"/#include "common-v15.h"/' "$f"; echo "  clk header rewired: $f"; } || true
          done
          # The 5.15 SoC platform symbols (ARCH_KALAMA/CROW/KAKA) do not exist
          # in the 6.6 tree, so every vendor-driver Kconfig that depends on
          # them was silently dropped at olddefconfig and no .ko was built.
          # Define them so the merged vermeer fragment entries survive.
          grep -q 'config ARCH_KALAMA' arch/arm64/Kconfig.platforms || \
          printf 'config ARCH_KALAMA\n  bool\nconfig ARCH_CROW\n  bool\nconfig ARCH_KAKA\n  bool\n' >> arch/arm64/Kconfig.platforms
          tail -n 12 arch/arm64/Kconfig.platforms
          # rsync --ignore-existing never copied the 5.15 BSP Kconfig files
          # (6.6 already has same-named ones), so every BSP module symbol was
          # undefined at olddefconfig and no .ko was built. Merge each 5.15
          # BSP Kconfig into its 6.6 counterpart: append only config blocks
          # whose symbol is not already defined, and drop 'source' lines
          # pointing at BSP files that do not exist in the 6.6 tree.
          for pair in drivers/soc/qcom drivers/clk/qcom drivers/pinctrl/qcom \
                      drivers/interconnect/qcom drivers/iommu drivers/remoteproc \
                      drivers/phy/qualcomm drivers/usb drivers/edac ; do
            v15="../vermeer/$pair/Kconfig"
            g66="$pair/Kconfig"
            [ -f "$v15" ] && [ -f "$g66" ] || continue
            grep -E '^(config|menuconfig) ' "$g66" | awk '{print $2}' | sort -u > /tmp/defined.txt
            awk -v DEFF=/tmp/defined.txt '
              BEGIN { while ((getline l < DEFF) > 0) def[l]=1 }
              /^(config|menuconfig) / { name=$2; blk=$0; inblk=1; keep=((name in def)?0:1); if (keep) print blk; next }
              inblk && /^[ \t]/ { if (keep) print; next }
              inblk && /^$/ { inblk=0; keep=0; print ""; next }
              { inblk=0; keep=0 }
            ' "$v15" | grep -v '^source ' >> "$g66" || true
          done
          echo "=== merged BSP Kconfig additions ==="
          for pair in drivers/soc/qcom drivers/clk/qcom drivers/pinctrl/qcom; do
            echo "$pair: $(grep -c '^config ' $pair/Kconfig) total configs"
          done
          # Same story for the Makefiles: rsync --ignore-existing never copied
          # the 5.15 Makefiles, so obj-$(CONFIG_...) build rules for BSP modules
          # (SM_GCC_KALAMA, PINCTRL_KALAMA, ...) were missing and modules with a
          # surviving =m config were silently not built. Append every 5.15
          # obj-* line the 6.6 Makefile does not already contain.
          for pair in drivers/soc/qcom drivers/clk/qcom drivers/pinctrl/qcom \
                      drivers/interconnect/qcom drivers/iommu drivers/remoteproc \
                      drivers/phy/qualcomm drivers/usb drivers/edac ; do
            v15m="../vermeer/$pair/Makefile"
            g66m="$pair/Makefile"
            [ -f "$v15m" ] && [ -f "$g66m" ] || continue
            added=0
            while IFS= read -r line; do
              case "$line" in
                # clk-dummy.o needs the 5.15-only clk_dummy struct from the
                # 5.15 common.h; skip it (6.6 has no dummy-clock concept).
                obj-*clk-dummy.o*) ;;
                obj-*) grep -qF "$line" "$g66m" || { echo "$line" >> "$g66m"; added=$((added+1)); } ;;
              esac
            done < "$v15m"
            echo "  $pair/Makefile: +$added obj lines"
          done

      - name: Generate .config (gki_defconfig + vermeer fragment)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          curl -fsSL --retry 3 -o arch/arm64/configs/vendor/vermeer_GKI.config "$VERMEER_FRAGMENT_URL" 2>/dev/null || {
            mkdir -p arch/arm64/configs/vendor
            curl -fsSL --retry 3 -o arch/arm64/configs/vendor/vermeer_GKI.config "$VERMEER_FRAGMENT_URL"
          }
          make O=out ARCH=arm64 LLVM=1 gki_defconfig < /dev/null
          # make O=out writes the config to out/.config, but merge_config's
          # base must live in the source root. Copy it back first, otherwise
          # merge_config starts from an empty base and the gki_defconfig
          # settings (incl. CONFIG_MODULES=y) are lost, degrading every =m.
          cp out/.config .config
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/vermeer_GKI.config || true
          echo "=== PRE-OLDDEFCONFIG (.config right after merge) ==="
          grep -E '^CONFIG_(MODULES|ARCH_KALAMA|PINCTRL_KALAMA|QCOM_LLCC)=|^# CONFIG_(MODULES|ARCH_KALAMA)' .config || echo "  none of the key symbols present pre-olddefconfig"
          echo "pre =m entries: $(grep -c '=m$' .config || true)"
          mv .config out/.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig < /dev/null
          echo "=== POST-OLDDEFCONFIG ==="
          grep -E '^CONFIG_(MODULES|ARCH_KALAMA|PINCTRL_KALAMA|QCOM_LLCC)=|^# CONFIG_(MODULES|ARCH_KALAMA)' out/.config || echo "  none of the key symbols present post-olddefconfig"
          echo "post =m entries: $(grep -c '=m$' out/.config || true)"
          echo "=== kconfig knows ARCH_KALAMA? ==="
          grep -c 'source "arch/arm64/Kconfig.platforms"' arch/arm64/Kconfig || true
          grep -c 'config ARCH_KALAMA' arch/arm64/Kconfig.platforms || echo "  ARCH_KALAMA definition MISSING"
          echo "=== config entries ==="
          grep -c '^CONFIG' out/.config || true
          echo "=== driver options of interest ==="
          grep -E 'CONFIG_DRM_MSM|CONFIG_QCOM_|CONFIG_QCACLD|CONFIG_MSM_|CONFIG_QCOM_CAMSS|CONFIG_INTERCONNECT_QCOM' out/.config | head -n 30 || true
          echo "=== KEY SYMBOL SURVIVAL (post-merge olddefconfig) ==="
          echo "total =m entries: $(grep -c '=m$' out/.config || true)"
          for s in ARCH_KALAMA ARCH_CROW ARCH_KAKA PINCTRL_KALAMA PINCTRL_CROW PINCTRL_SM8550 GCC_KALAMA CAMCC_KALAMA DISPCC_KALAMA QCOM_LLCC QCOM_RPMH QCOM_AOSS MSM_QMP GUNYAH QCOM_HWSPINLOCK UFS_QCOM SDHCI_MSM CMD_DB; do
            v="$(grep -E "^CONFIG_${s}=" out/.config || grep -E "^# CONFIG_${s} " out/.config || echo "SYMBOL-LOST: ${s}")"
            echo "  $v"
          done

      - name: Build (collect errors, -k)
        env:
          LTO_MODE: ${{ inputs.lto || 'none' }}
          KEEP_GOING: ${{ inputs.keep_going && 'true' || 'false' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          ./scripts/config --file out/.config -d WERROR
          case "$LTO_MODE" in
            thin) ./scripts/config --file out/.config -d LTO_NONE -e LTO_CLANG_THIN ;;
            full) ./scripts/config --file out/.config -d LTO_NONE -e LTO_CLANG_FULL ;;
            *) ./scripts/config --file out/.config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE ;;
          esac
          # GKI disables CONFIG_MODULE_UNLOAD, but the vermeer driver stack
          # (gunyah vm_mgr.c) references module_refcount() which only exists
          # when unloading is compiled in. Enable it.
          ./scripts/config --file out/.config -e MODULE_UNLOAD
          # 5.15-private rpmsg API (ept->rx_done etc.) was removed in 6.6 and
          # glink_pkt.ko is not in the official vermeer module list: skip it.
          ./scripts/config --file out/.config -d QCOM_GLINK_PKT
          # The 5.15 BSP clock drivers (gcc/camcc/dispcc/tcsrcc/video/debugcc-
          # kalama) depend on Qualcomm's private vdd-regulator header stack,
          # which does not exist in 6.6. Use the upstream sm8550 clock drivers
          # instead - they match the same DTB clock node compatibles.
          ./scripts/config --file out/.config \
            -d SM_GCC_KALAMA -d SM_CAMCC_KALAMA -d SM_DISPCC_KALAMA \
            -d SM_TCSRCC_KALAMA -d SM_VIDEOCC_KALAMA -d SM_DEBUGCC_KALAMA
          ./scripts/config --file out/.config \
            -m SM_GCC_8550 -m SM_CAMCC_8550 -m SM_DISPCC_8550 \
            -m SM_GPUCC_8550 -m SM_VIDEOCC_8550 || true
          # 5.15 pmic_glink client struct differs from 6.6's; battery debug
          # is not in the official vermeer module list - skip it.
          ./scripts/config --file out/.config -d QTI_BATTERY_GLINK_DEBUG
          # Same 5.15 pmic_glink client-data layout, same reasoning: the
          # charger-ulog and altmode glink clients are debug facilities that
          # are not in the official vermeer module list - skip them too.
          ./scripts/config --file out/.config \
            -d QTI_CHARGER_ULOG_GLINK -d QTI_ALTMODE_GLINK
          # ... and the spmi glink debug client - same story.
          ./scripts/config --file out/.config -d SPMI_QTI_GLINK_DEBUG
          # The 5.15 mem-hooks/mem-offline drivers depend on Qualcomm's
          # private 5.15 MM internals (mkswapd array, MAX_KSWAPD_THREADS)
          # that do not exist in 6.6 MM: skip them.
          ./scripts/config --file out/.config \
            -d QCOM_MEM_HOOKS -d QCOM_MEM_OFFLINE
          # llcc_perfmon uses the 5.15 llcc_drv_data layout (single regmap,
          # llcc_ver, offsets); 6.6 upstream restructured it to regmaps[] -
          # perfmon is a debug facility, not in the official module list.
          ./scripts/config --file out/.config -d QCOM_LLCC_PERFMON
          # core_hang_detect touches bus_type.dev_root, removed in 6.6; it
          # is a debug facility not in the official vermeer module list.
          ./scripts/config --file out/.config -d MSM_CORE_HANG_DETECT
          # qdss_bridge uses the 5.15-private MHI API (MHI_MAX_MTU, two-arg
          # mhi calls); it is a debug facility not in the official list.
          ./scripts/config --file out/.config -d QCOM_QDSS_BRIDGE
          # Batch: every soc/qcom target that is fragment=m, NOT in the
          # official vermeer module list, and built on 5.15-private
          # frameworks (sleep-stats collectors, dump collectors, BAM/SPS
          # DMA, slate/tmecom, panel event, hung-task enh, etc). Skipping
          # all of them does not reduce official module coverage.
          ./scripts/config --file out/.config \
            -d QCOM_CPUSS_SLEEP_STATS -d MEM_SHARE_QMI_SERVICE \
            -d QCOM_SMP2P_SLEEPSTATE -d QSEE_IPC_IRQ_BRIDGE -d QCOM_GLINK \
            -d QCOM_CDSP_RM -d QCOM_SYSMON_SUBSYSTEM_STATS \
            -d QCOM_SUBSYSTEM_SLEEP_STATS -d QCOM_SOC_SLEEP_STATS \
            -d QCOM_ADSP_SLEEPMON -d MSM_TMECOM_QMP -d QCOM_MICRODUMP \
            -d MSM_CDSP_LOADER -d QTI_PMIC_PON_LOG -d MSM_BOOT_STATS \
            -d QCOM_RUN_QUEUE_STATS -d USB_BAM -d QCOM_DCVS -d QTI_RIMPS_LOG \
            -d QCOM_RAMDUMP -d QCOM_PANEL_EVENT_NOTIFIER \
            -d QCOM_VM_DMESG_DUMPER -d QCOM_FSA4480_I2C \
            -d SHOW_SUSPEND_EPOCH -d GH_TLMM_VM_MEM_ACCESS -d SPS \
            -d MSM_PERFORMANCE -d QCOM_VA_MINIDUMP -d MSM_QBT_HANDLER \
            -d QCOM_HUNG_TASK_ENH
          make O=out ARCH=arm64 LLVM=1 olddefconfig < /dev/null
          KFLAG=""
          [ "$KEEP_GOING" = "true" ] && KFLAG="-k"
          find . -not -path './out*' -exec touch -d @0 {} + 2>/dev/null || true
          make $KFLAG -j"$(nproc)" O=out ARCH=arm64 LLVM=1 \
               KCFLAGS='-Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-error=int-conversion' \
               Image modules < /dev/null 2>&1 | tee -a build.log || build_failed=1
          echo "=== build output ==="
          ls -lh out/arch/arm64/boot/Image 2>/dev/null || echo "NO IMAGE"
          find out -name '*.ko' 2>/dev/null | wc -l
          if [ "${build_failed:-0}" = "1" ]; then
            echo "BUILD FAILED - collecting error digest"
            grep -E 'error:|Error [0-9]' build.log | sort | uniq -c | sort -rn | head -n 60 > errors-digest.txt || true
            cat errors-digest.txt || true
            echo "=== first 40 error contexts ==="
            grep -n -m 40 -E 'error:|Error [0-9]' build.log || true
            exit 1
          fi

      - name: Restore build tree cache (resume across iterations)
        uses: actions/cache/restore@v4
        with:
          path: kernel/out
          key: port-66-out-${{ github.run_id }}
          restore-keys: port-66-out-

      - name: Package port output (Image + modules + match report)
        if: always()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          A="../port-out"
          rm -rf "$A" && mkdir -p "$A"
          cp out/arch/arm64/boot/Image "$A/" 2>/dev/null || echo "NO IMAGE"
          cp out/System.map "$A/" 2>/dev/null || true
          cp out/.config "$A/kernel.config" 2>/dev/null || true
          find out -name '*.ko' | while read -r k; do
            rel="${k#out/}"
            mkdir -p "$A/$(dirname "$rel")"
            cp "$k" "$A/$rel"
          done
          echo "=== packaged .ko files: $(find "$A" -name '*.ko' | wc -l) ==="
          if curl -fsSL --retry 3 -o /tmp/vermeer-ml "$VERMEER_MODULE_LIST_URL" 2>/dev/null; then
            find out -name '*.ko' -printf '%f\n' | sort -u > /tmp/built
            grep -v '^#' /tmp/vermeer-ml | grep -v '^$' | sed 's/\.ko$//' | sort > /tmp/want
            echo "=== official vermeer module list: $(wc -l < /tmp/want) entries; built unique modules: $(wc -l < /tmp/built) ==="
            sed 's/\.ko$//' /tmp/built | sort > /tmp/builtbase
            echo "--- MATCHED (official list module that got built): $(comm -12 /tmp/want /tmp/builtbase | wc -l) ---"
            comm -12 /tmp/want /tmp/builtbase > "$A/modules-matched.txt"
            echo "--- MISSING (official list module NOT built): $(comm -23 /tmp/want /tmp/builtbase | wc -l) ---"
            comm -23 /tmp/want /tmp/builtbase > "$A/modules-missing.txt"
            cat "$A/modules-missing.txt" || true
          else
            echo "official module list fetch failed"
          fi
        env:
          VERMEER_MODULE_LIST_URL: https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/bsp-vermeer-t-oss/modules.list.msm.vermeer

      - name: Upload port output (Image + modules)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-output-${{ github.run_id }}
          path: port-out
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-diag-${{ github.run_id }}
          path: |
            kernel/build.log
            kernel/errors-digest.txt
            kernel/out/.config
          if-no-files-found: warn
