name: Port vermeer vendor drivers to linux-6.6 (stage)

on:
  workflow_dispatch:
    inputs:
      lto:
        description: 'LTO mode'
        required: false
        default: 'none'
        type: choice
        options: [ none, thin, full ]
      keep_going:
        description: 'make -k (collect as many errors as possible)'
        required: false
        default: true
        type: boolean
  push:
    branches: [ linux-6.6-port ]

concurrency:
  group: port-66-${{ github.ref }}
  cancel-in-progress: true

env:
  G66_REPO: https://android.googlesource.com/kernel/common.git
  G66_BRANCH: android15-6.6
  V15_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  V15_BRANCH: bsp-vermeer-t-oss
  VERMEER_FRAGMENT_URL: https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/53ef33eacdc4f7ac737451e4cfc91963d59e3956/arch/arm64/configs/vendor/vermeer_GKI.config

jobs:
  port:
    name: Copy vermeer 5.15 drivers onto GKI 6.6 and build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout port scripts
        uses: actions/checkout@v4
        with:
          # The branch now CONTAINS the full kernel source tree (imported by
          # import-source.yml). Checkout to src/ so it can be renamed to
          # kernel/ - the tree's own top-level kernel/ dir would otherwise
          # collide with the clone target name below.
          path: src

      - name: Maximize runner disk space
        run: |
          set -e
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio zip unzip curl wget git rsync \
            libssl-dev libelf-dev libncurses-dev \
            zstd lz4 lzop u-boot-tools kmod dwarves \
            python3 python-is-python3 clang lld llvm
          clang --version | head -n1

      - name: Clone GKI 6.6 + vermeer 5.15 source trees (or reuse in-repo tree)
        id: srctree
        run: |
          set -e
          if [ -f src/Makefile ] && [ -d src/drivers ]; then
            echo "=== branch is self-contained: using the in-repo tree ==="
            mv src kernel
            # keep $GITHUB_WORKSPACE/port-6.6 valid for the payload steps
            ln -sfn kernel/port-6.6 port-6.6
            echo "reused=true" >> "$GITHUB_OUTPUT"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) *=' kernel/Makefile
          else
            echo "=== branch has no source tree: cloning upstream ==="
            rm -rf src
            git clone --depth=1 -b "$G66_BRANCH" "$G66_REPO" kernel
            git clone --depth=1 -b "$V15_BRANCH" "$V15_REPO" vermeer
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "=== GKI 6.6 ==="; git -C kernel log -1 --format='%H %s'
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) *=' kernel/Makefile
            echo "=== vermeer 5.15 ==="; git -C vermeer log -1 --format='%H %s'
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) *=' vermeer/Makefile
          fi

      - name: Copy vermeer vendor driver stack onto GKI 6.6
        # in-repo tree already carries the applied port; skip re-applying
        if: steps.srctree.outputs.reused != 'true'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # BSP-only extras are merged with --ignore-existing so upstream 6.6
          # drivers are never clobbered; full-stack dirs (display/camera/wlan)
          # replace their 6.6 counterparts wholesale.
          rsync -a vermeer/drivers/gpu/drm/msm/ kernel/drivers/gpu/drm/msm/
          mkdir -p kernel/drivers/media/platform/msm
          rsync -a vermeer/drivers/media/platform/msm/ kernel/drivers/media/platform/msm/
          rsync -a --ignore-existing vermeer/drivers/soc/qcom/ kernel/drivers/soc/qcom/
          rsync -a --ignore-existing vermeer/drivers/clk/qcom/ kernel/drivers/clk/qcom/
          rsync -a --ignore-existing vermeer/drivers/pinctrl/qcom/ kernel/drivers/pinctrl/qcom/
          rsync -a --ignore-existing vermeer/drivers/interconnect/qcom/ kernel/drivers/interconnect/qcom/
          rsync -a --ignore-existing vermeer/drivers/iommu/ kernel/drivers/iommu/
          rsync -a --ignore-existing vermeer/drivers/remoteproc/ kernel/drivers/remoteproc/
          rsync -a --ignore-existing vermeer/drivers/phy/qualcomm/ kernel/drivers/phy/qualcomm/
          rsync -a --ignore-existing vermeer/drivers/usb/ kernel/drivers/usb/
          rsync -a --ignore-existing vermeer/drivers/net/wireless/vendor/ kernel/drivers/net/wireless/vendor/ 2>/dev/null || true
          for d in drivers/staging/qcacld-3.0 drivers/staging/fw-api; do
            [ -d "vermeer/$d" ] && rsync -a "vermeer/$d/" "kernel/$d/"
          done
          # 5.15 dt-bindings/uapi headers (qcom,ipcc.h etc.) are referenced by
          # the BSP drivers; merge them without clobbering 6.6 headers.
          # asm-generic is excluded: 5.15's asm-generic/termios.h conflicts
          # with 6.6's include/linux/termios_internal.h declarations.
          rsync -a --ignore-existing --exclude='asm-generic/' vermeer/include/ kernel/include/
          test -f kernel/include/dt-bindings/soc/qcom,ipcc.h && echo "qcom,ipcc.h merged"
          echo "=== copied tree stats ==="
          du -sh kernel/drivers/gpu/drm/msm kernel/drivers/media/platform/msm kernel/drivers/soc/qcom 2>/dev/null
          find kernel -name '*.ko' -o -name 'modules.order' | head -n1 >/dev/null || true

      - name: Wire vendor Kconfig/Makefile hooks into the 6.6 tree
        if: steps.srctree.outputs.reused != 'true'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          # display: 6.6 drm/Kconfig already sources msm/Kconfig (upstream), and
          # drm/Makefile already descends into msm/. Verify; add if missing.
          grep -q 'source "drivers/gpu/drm/msm/Kconfig"' drivers/gpu/drm/Kconfig || echo 'source "drivers/gpu/drm/msm/Kconfig"' >> drivers/gpu/drm/Kconfig
          # camera/media: hook msm/ into the platform Kconfig/Makefile
          grep -q 'source "drivers/media/platform/msm/Kconfig"' drivers/media/platform/Kconfig || echo 'source "drivers/media/platform/msm/Kconfig"' >> drivers/media/platform/Kconfig
          grep -q 'obj-y += msm/' drivers/media/platform/Makefile || printf 'obj-y += msm/\n' >> drivers/media/platform/Makefile
          # qcacld: vermeer's drivers/staging/Kconfig/Makefile lines
          for f in Kconfig Makefile; do
            if [ -f "../vermeer/drivers/staging/$f" ]; then
              grep -E 'qcacld|fw-api' "../vermeer/drivers/staging/$f" | while IFS= read -r line; do
                grep -qF "$line" "drivers/staging/$f" || printf '%s\n' "$line" >> "drivers/staging/$f"
              done
            fi
          done
          echo "=== wired hooks ==="
          grep -n 'msm' drivers/media/platform/Kconfig drivers/media/platform/Makefile || true
          grep -n 'qcacld' drivers/staging/Kconfig drivers/staging/Makefile || true
          # Linux 6.6 removed module_refcount(); AOSP's gunyah vm_mgr.c still
          # references it but never rots because GKI keeps GUNYAH=n. The vermeer
          # fragment enables GUNYAH, so drop the stale refcount check.
          sed -i 's/WARN_ON(fn->mod \&\& module_refcount(fn->mod));/WARN_ON(0);/' drivers/virt/gunyah/vm_mgr.c
          grep -n 'WARN_ON(0)' drivers/virt/gunyah/vm_mgr.c
          # 6.4+ removed the owner arg from class_create(): fix every copied
          # 5.15 driver that still calls class_create(THIS_MODULE, "name").
          n=0
          grep -rl 'class_create(THIS_MODULE' drivers/ arch/ 2>/dev/null | while read -r f; do
            sed -i 's/class_create(THIS_MODULE, /class_create(/g' "$f"
            echo "  fixed: $f"
            n=$((n+1))
          done
          echo "class_create fixes applied"
          # The 5.15 BSP hwkm headers include userspace <stdbool.h> /
          # <stddef.h>; the kernel's bool and size_t already come from
          # linux/types.h. Drop such includes.
          for uh in stdbool.h stddef.h stdint.h; do
            grep -rl "#include <$uh>" include/ drivers/ 2>/dev/null | while read -r f; do
              sed -i "/#include <$uh>/d" "$f"
              echo "  dropped $uh from: $f"
            done
          done
          # ... and the same call split across two lines (dcc_v2.c style):
          # class_create(THIS_MODULE,\n "name") - the single-line sed above
          # missed it, so strip the owner arg at end-of-line too.
          grep -rl 'class_create(THIS_MODULE,$' drivers/ arch/ 2>/dev/null | while read -r f; do
            sed -i 's/class_create(THIS_MODULE,$/class_create(/' "$f"
            echo "  multiline class_create fixed: $f"
          done
          # 6.2 made uart_ops.set_termios take a const old termios; fix the
          # 5.15 eud uart driver signature to match.
          sed -i '/eud_set_termios(struct uart_port \*port/,+1 s/struct ktermios \*old)/const struct ktermios *old)/' drivers/soc/qcom/eud.c
          sed -n '393,394p' drivers/soc/qcom/eud.c || true
          # msm_minidump pulls the boot banner from the 5.15-private
          # android_debug_symbol(ADS_LINUX_BANNER) framework, which 6.6 does
          # not have; substitute the kernel's standard version string.
          sed -i 's|linux_banner = android_debug_symbol(ADS_LINUX_BANNER);|linux_banner = "Linux";|' drivers/soc/qcom/msm_minidump.c
          # 6.6 FORTIFY statically flags the 5.15 banner/strtable writes in
          # msm_minidump.c; that is port noise, not a real bug - disable
          # fortify for just this object.
          grep -q CFLAGS_msm_minidump drivers/soc/qcom/Makefile || \
            echo 'CFLAGS_msm_minidump.o := -D__NO_FORTIFY' >> drivers/soc/qcom/Makefile
          # minidump_log.c fix happens after the Makefile merge below
          # (the minidump-y set line is only appended there).
          # 6.9 made ww_mutex_trylock() take a ww_acquire_ctx too; the 5.15
          # callers pass only the lock. Add NULL for single-arg calls.
          grep -rl 'ww_mutex_trylock(' drivers/ 2>/dev/null | while read -r f; do
            sed -i 's/ww_mutex_trylock(\([^,)]*\))/ww_mutex_trylock(\1, NULL)/g' "$f"
          done
          grep -rn 'ww_mutex_trylock(' drivers/clk/qcom/gdsc-regulator.c | head -n 4 || true
          # 5.15 BSP pinctrl drivers (kalama/crow) need the 5.15 msm_pingroup
          # layout (wake_reg/wake_bit fields), which differs from upstream
          # 6.6's. Give them a private copy of the 5.15 header instead of
          # clobbering the 6.6 one that upstream pinctrl-msm.c still uses.
          cp ../vermeer/drivers/pinctrl/qcom/pinctrl-msm.h drivers/pinctrl/qcom/pinctrl-msm-v15.h
          for f in drivers/pinctrl/qcom/pinctrl-kalama.c drivers/pinctrl/qcom/pinctrl-crow.c; do
            [ -f "$f" ] && sed -i 's/#include "pinctrl-msm.h"/#include "pinctrl-msm-v15.h"/' "$f"
          done
          grep -l 'pinctrl-msm-v15' drivers/pinctrl/qcom/*.c 2>/dev/null || true
          # Same pattern for the 5.15 BSP clock drivers (gcc/camcc/dispcc/
          # tcsrcc/videocc-kalama): they need the 5.15 common.h (vdd_cx,
          # HW_CLK_CTRL_MODE) and clk-debug.h, which differ from upstream's.
          cp ../vermeer/drivers/clk/qcom/common.h drivers/clk/qcom/common-v15.h
          [ -f ../vermeer/drivers/clk/qcom/clk-debug.h ] && cp ../vermeer/drivers/clk/qcom/clk-debug.h drivers/clk/qcom/clk-debug-v15.h
          for f in drivers/clk/qcom/*kalama*.c drivers/clk/qcom/*crow*.c drivers/clk/qcom/clk-debug.c; do
            [ -f "$f" ] || continue
            sed -i 's/#include "common.h"/#include "common-v15.h"/; s/#include "clk-debug.h"/#include "clk-debug-v15.h"/' "$f"
            echo "  clk header rewired: $f"
          done
          # and any other 5.15 BSP .c that made it in and includes common.h
          for f in $(grep -l '#include "common.h"' drivers/clk/qcom/*.c 2>/dev/null); do
            case "$f" in *kalama*|*crow*) continue ;; esac
            grep -qF "vdd_cx" "$f" && { sed -i 's/#include "common.h"/#include "common-v15.h"/' "$f"; echo "  clk header rewired: $f"; } || true
          done
          # The 5.15 SoC platform symbols (ARCH_KALAMA/CROW/KAKA) do not exist
          # in the 6.6 tree, so every vendor-driver Kconfig that depends on
          # them was silently dropped at olddefconfig and no .ko was built.
          # Define them so the merged vermeer fragment entries survive.
          grep -q 'config ARCH_KALAMA' arch/arm64/Kconfig.platforms || \
          printf 'config ARCH_KALAMA\n  bool\nconfig ARCH_CROW\n  bool\nconfig ARCH_KAKA\n  bool\n' >> arch/arm64/Kconfig.platforms
          tail -n 12 arch/arm64/Kconfig.platforms
          # rsync --ignore-existing never copied the 5.15 BSP Kconfig files
          # (6.6 already has same-named ones), so every BSP module symbol was
          # undefined at olddefconfig and no .ko was built. Merge each 5.15
          # BSP Kconfig into its 6.6 counterpart: append only config blocks
          # whose symbol is not already defined, and drop 'source' lines
          # pointing at BSP files that do not exist in the 6.6 tree.
          for pair in drivers/soc/qcom drivers/clk/qcom drivers/pinctrl/qcom \
                      drivers/interconnect/qcom drivers/iommu drivers/remoteproc \
                      drivers/phy/qualcomm drivers/usb drivers/edac ; do
            v15="../vermeer/$pair/Kconfig"
            g66="$pair/Kconfig"
            [ -f "$v15" ] && [ -f "$g66" ] || continue
            grep -E '^(config|menuconfig) ' "$g66" | awk '{print $2}' | sort -u > /tmp/defined.txt
            awk -v DEFF=/tmp/defined.txt '
              BEGIN { while ((getline l < DEFF) > 0) def[l]=1 }
              /^(config|menuconfig) / { name=$2; blk=$0; inblk=1; keep=((name in def)?0:1); if (keep) print blk; next }
              inblk && /^[ \t]/ { if (keep) print; next }
              inblk && /^$/ { inblk=0; keep=0; print ""; next }
              { inblk=0; keep=0 }
            ' "$v15" | grep -v '^source ' >> "$g66" || true
          done
          echo "=== merged BSP Kconfig additions ==="
          for pair in drivers/soc/qcom drivers/clk/qcom drivers/pinctrl/qcom; do
            echo "$pair: $(grep -c '^config ' $pair/Kconfig) total configs"
          done
          # QTI_CRYPTO_COMMON depends on SCSI_UFS_CRYPTO_QTI/MMC_CRYPTO_QTI,
          # 5.15-only symbols the 6.6 tree does not define (the 5.15 UFS
          # stack was never copied), so olddefconfig kept it off and the
          # crypto-qti-platform.h stubs collided with the real functions.
          # Drop that one dependency line (AFTER the merge, so the block
          # actually exists) so the lib can build standalone.
          sed -i '/^config QTI_CRYPTO_COMMON/,/^config /{ /depends on SCSI_UFS_CRYPTO_QTI/d; }' drivers/soc/qcom/Kconfig
          grep -A3 '^config QTI_CRYPTO_COMMON' drivers/soc/qcom/Kconfig | head -n 4 || true
          # Same story for the Makefiles: rsync --ignore-existing never copied
          # the 5.15 Makefiles, so obj-$(CONFIG_...) build rules for BSP modules
          # (SM_GCC_KALAMA, PINCTRL_KALAMA, ...) were missing and modules with a
          # surviving =m config were silently not built. Append every 5.15
          # obj-* line the 6.6 Makefile does not already contain.
          for pair in drivers/soc/qcom drivers/clk/qcom drivers/pinctrl/qcom \
                      drivers/interconnect/qcom drivers/iommu drivers/remoteproc \
                      drivers/phy/qualcomm drivers/usb drivers/edac ; do
            v15m="../vermeer/$pair/Makefile"
            g66m="$pair/Makefile"
            [ -f "$v15m" ] && [ -f "$g66m" ] || continue
            # Composite-module set names ALREADY defined in the 6.6 Makefile
            # must not be polluted (5.15 clk-qcom-y members need 5.15 headers);
            # every other 5.15 composite set line is copied so its obj- target
            # has a build rule (minidump is trimmed by the sed below).
            grep -E '^[a-zA-Z0-9_-]+-(y|objs|\$\(CONFIG_[A-Z0-9_]+\))[[:space:]]*[:+]?=' "$g66m" \
              | sed -E 's/^([a-zA-Z0-9_-]+)-.*/\1/' | sort -u > /tmp/g66sets.txt || :
            added=0
            while IFS= read -r line; do
              case "$line" in
                # clk-dummy.o needs the 5.15-only clk_dummy struct from the
                # 5.15 common.h; skip it (6.6 has no dummy-clock concept).
                obj-*clk-dummy.o*) ;;
                obj-*) grep -qF "$line" "$g66m" || { echo "$line" >> "$g66m"; added=$((added+1)); } ;;
                # composite-module object set definitions (name-y / name-objs /
                # name-$(CONFIG...)): copy only if that set name is NOT already
                # defined as a set in the 6.6 Makefile.
                *)
                  if printf '%s' "$line" | grep -qE '^[a-zA-Z0-9_-]+-(y|objs|\$\(CONFIG_[A-Z0-9_]+\))[[:space:]]*[:+]?='; then
                    sname=$(printf '%s' "$line" | sed -E 's/^([a-zA-Z0-9_-]+)-.*/\1/')
                    if ! grep -qx "$sname" /tmp/g66sets.txt && ! grep -qF "$line" "$g66m"; then
                      echo "$line" >> "$g66m"; added=$((added+1))
                    fi
                  fi ;;
              esac
            done < "$v15m"
            echo "  $pair/Makefile: +$added obj lines"
          done
          # minidump_log.c (part of the minidump-y object set) needs 5.15-only
          # structures (cfs_rq.last, module.core_layout, android_debug_symbol,
          # old vendor-hook signature); drop the debug-log exporter from the
          # set, keep the minidump core. Must run AFTER the merge above,
          # which is what appends the minidump-y line in the first place.
          sed -i 's/minidump-y[[:space:]]*+= msm_minidump.o minidump_log.o/minidump-y   += msm_minidump.o/' drivers/soc/qcom/Makefile
          grep 'minidump-y' drivers/soc/qcom/Makefile || true
          # 6.6 upstream already builds qcom_common.o as its own module
          # (obj-$(CONFIG_QCOM_RPROC_COMMON) += qcom_common.o); the 5.15
          # rproc_qcom_common-y set lines re-wrap the SAME qcom_common.o
          # into rproc_qcom_common.ko, exporting every symbol twice at
          # modpost. Drop the two appended 5.15 lines.
          sed -i '/^obj-$(CONFIG_QCOM_RPROC_COMMON)[[:space:]]*+= rproc_qcom_common.o$/d; /^rproc_qcom_common-y[[:space:]]*:=/d' drivers/remoteproc/Makefile
          grep -n 'rproc_qcom_common' drivers/remoteproc/Makefile || echo '  rproc_qcom_common lines removed'
          # 6.6 upstream already builds qcom_common.o as its own module
          # (obj-$(CONFIG_QCOM_RPROC_COMMON) += qcom_common.o); the 5.15
          # rproc_qcom_common-y set lines re-wrap the SAME qcom_common.o
          # into rproc_qcom_common.ko, exporting every symbol twice at
          # modpost. Drop the two appended 5.15 lines.
          sed -i '/^obj-$(CONFIG_QCOM_RPROC_COMMON)[[:space:]]*+= rproc_qcom_common.o$/d; /^rproc_qcom_common-y[[:space:]]*:=/d' drivers/remoteproc/Makefile
          grep -n 'rproc_qcom_common' drivers/remoteproc/Makefile || echo '  rproc_qcom_common lines removed'
          # debug_symbol.c (official module list member) includes the 5.15
          # drivers/staging/android/debug_kinfo.h via a relative path; 6.6
          # has no such file. Copy it in.
          mkdir -p drivers/staging/android
          cp ../vermeer/drivers/staging/android/debug_kinfo.h drivers/staging/android/
          # --- FBE crypto stack wiring (hwkm + crypto-qti-hwkm are official) ---
          # 1) tmecom Kconfig: the merge dropped 'source' lines, so
          #    MSM_TMECOM_QMP never existed; re-add the source line.
          grep -q 'tmecom/Kconfig' drivers/soc/qcom/Kconfig || \
            echo 'source "drivers/soc/qcom/tmecom/Kconfig"' >> drivers/soc/qcom/Kconfig
          grep -q 'mem_buf/Kconfig' drivers/soc/qcom/Kconfig || \
            echo 'source "drivers/soc/qcom/mem_buf/Kconfig"' >> drivers/soc/qcom/Kconfig
          # 6.6 const-qualified the class devnode callback (struct device ->
          # const struct device); adapt the 5.15 mem_buf callback.
          sed -i 's/(struct device \*dev, umode_t \*mode)/(const struct device *dev, umode_t *mode)/' drivers/soc/qcom/mem_buf/mem-buf-ids.c
          grep -n 'const struct device \*dev, umode_t' drivers/soc/qcom/mem_buf/mem-buf-ids.c | head -n 2
          # 6.6 exports dma_buf_* in the DMA_BUF namespace; 5.15 sources never
          # import it (namespaces did not apply). Append MODULE_IMPORT_NS.
          for f in drivers/soc/qcom/mem_buf/*.c; do
            grep -q 'MODULE_IMPORT_NS(DMA_BUF)' "$f" || \
              printf '\nMODULE_IMPORT_NS(DMA_BUF);\n' >> "$f"
          done
          grep -l 'MODULE_IMPORT_NS(DMA_BUF)' drivers/soc/qcom/mem_buf/*.c | wc -l
          # 1b) Camera phase 1: backport the whole camss subsystem from v6.15
          #    (SM8550 Titan 780: camss.c sm8550 resources, camss-csid-780,
          #    camss-vfe-780, updated csiphy-3ph, camss-format helper) and
          #    camcc-sm8550.c from v6.8. 6.6's camss registers only up to
          #    sm8250; the v6.15 sources use no streams-API so they should
          #    build against the 6.6 V4L2 core. Payload lives in the repo
          #    under port-6.6/ (33 camss files + camcc + dt-bindings header).
          rsync -a "$GITHUB_WORKSPACE/port-6.6/camss-6.15/" drivers/media/platform/qcom/camss/
          cp "$GITHUB_WORKSPACE/port-6.6/camcc-sm8550.c" drivers/clk/qcom/
          cp "$GITHUB_WORKSPACE/port-6.6/qcom,sm8550-camcc.h" include/dt-bindings/clock/
          grep -q 'camcc-sm8550' drivers/clk/qcom/Makefile ||             echo 'obj-$(CONFIG_SM_CAMCC_8550) += camcc-sm8550.o' >> drivers/clk/qcom/Makefile
          if ! grep -q 'config SM_CAMCC_8550' drivers/clk/qcom/Kconfig; then
            printf 'config SM_CAMCC_8550\n\ttristate "SM8550 Camera Clock Controller"\n\tdepends on ARM64 || COMPILE_TEST\n\tselect SM_GCC_8550\n\thelp\n\t  Camera clock controller for SM8550.\n' >> drivers/clk/qcom/Kconfig
          fi
          grep -c 'camss-csid-780\|camss-vfe-780' drivers/media/platform/qcom/camss/Makefile
          # 1c) OV50E (OVX8000) main-sensor driver: new V4L2 subdev written
          #    from Motorola's GPL OV50E kernel driver register tables
          #    (chip id 0x5045, i2c 0x10, xclk 24MHz, avdd/dovdd/dvdd).
          cp "$GITHUB_WORKSPACE/port-6.6/ov50e.c" drivers/media/i2c/
          grep -q 'ov50e' drivers/media/i2c/Makefile ||             echo 'obj-$(CONFIG_VIDEO_OV50E) += ov50e.o' >> drivers/media/i2c/Makefile
          if ! grep -q 'config VIDEO_OV50E' drivers/media/i2c/Kconfig; then
            printf 'config VIDEO_OV50E\n\ttristate "OmniVision OV50E sensor support"\n\tdepends on I2C && VIDEO_DEV\n\tselect MEDIA_CONTROLLER\n\tselect VIDEO_V4L2_SUBDEV_API\n\tselect V4L2_FWNODE\n\thelp\n\t  OmniVision OV50E 50MP sensor (Redmi K70 main camera).\n' >> drivers/media/i2c/Kconfig
          fi
          # 1d) Camera phase 1 DT: vermeer camss/cci/camcc/ov50e test DTB.
          #    Stock DTBs ship zero camera nodes (Xiaomi stripped them), so
          #    this test DT re-creates the platform nodes from upstream.
          cp "$GITHUB_WORKSPACE/port-6.6/vermeer-camss-test.dts" arch/arm64/boot/dts/qcom/sm8550-vermeer-camss-test.dts
          grep -q 'vermeer-camss-test' arch/arm64/boot/dts/qcom/Makefile ||             echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8550-vermeer-camss-test.dtb' >> arch/arm64/boot/dts/qcom/Makefile
          # 2) qtee_shmbridge: lives in drivers/firmware/ in 5.15, outside the
          #    rsync set. Copy it and hook it into the qcom-scm composite set
          #    (6.6 uses qcom-scm-y) plus its Kconfig block.
          cp ../vermeer/drivers/firmware/qtee_shmbridge.c ../vermeer/drivers/firmware/qtee_shmbridge_internal.h drivers/firmware/
          grep -q 'qtee_shmbridge' drivers/firmware/Makefile || \
            echo 'qcom-scm-$(CONFIG_QTEE_SHM_BRIDGE) += qtee_shmbridge.o' >> drivers/firmware/Makefile
          grep -n 'qcom-scm' drivers/firmware/Makefile | head -n 4
          grep -q 'config QTEE_SHM_BRIDGE' drivers/firmware/Kconfig || \
            printf 'config QTEE_SHM_BRIDGE\n\tbool "QTI TEE shared memory bridge"\n\tdepends on QCOM_SCM\n\tdefault y if QCOM_SCM\n\thelp\n\t  QTEE shared memory bridge driver provides kernel APIs to share\n\t  memory between trustzone and other VMs through shared memory bridge.\n\n' >> drivers/firmware/Kconfig
          # 3) qcom_scm ES v2 calls: crypto-qti-hwkm needs
          #    config_set_ice_key/clear_ice_key/derive_raw_secret, which only
          #    exist in the 5.15 qcom_scm.c. Append the macros (missing in
          #    6.6's local qcom_scm.h), the header decls, and the bodies.
          grep -q 'QCOM_SCM_ES_DERIVE_RAW_SECRET' drivers/firmware/qcom_scm.h || \
            sed -i '/#define QCOM_SCM_ES_CONFIG_SET_ICE_KEY/a #define QCOM_SCM_ES_CONFIG_SET_ICE_KEY_V2 0x05\n#define QCOM_SCM_ES_CLEAR_ICE_KEY\t\t0x06\n#define QCOM_SCM_ES_DERIVE_RAW_SECRET\t0x07' drivers/firmware/qcom_scm.h
          grep -n 'QCOM_SCM_ES' drivers/firmware/qcom_scm.h
          grep -q 'qcom_scm_derive_raw_secret' include/linux/qcom_scm.h || \
            sed -i 's|^#endif /\* __QCOM_SCM_H \*/$|extern int qcom_scm_config_set_ice_key(uint32_t index, phys_addr_t paddr, size_t size, uint32_t cipher, unsigned int data_unit, unsigned int ce);\nextern int qcom_scm_clear_ice_key(uint32_t index, unsigned int ce);\nextern int qcom_scm_derive_raw_secret(phys_addr_t paddr_key, size_t size_key, phys_addr_t paddr_secret, size_t size_secret);\n\n#endif /* __QCOM_SCM_H */|' include/linux/qcom_scm.h
          grep -n 'derive_raw_secret' include/linux/qcom_scm.h
          grep -q 'qcom_scm_derive_raw_secret' drivers/firmware/qcom_scm.c || cat >> drivers/firmware/qcom_scm.c <<'SCMEOF'

          int qcom_scm_config_set_ice_key(uint32_t index, phys_addr_t paddr, size_t size,
                                          uint32_t cipher, unsigned int data_unit,
                                          unsigned int ce)
          {
                  struct qcom_scm_desc desc = {
                          .svc = QCOM_SCM_SVC_ES,
                          .cmd = QCOM_SCM_ES_CONFIG_SET_ICE_KEY_V2,
                          .owner = ARM_SMCCC_OWNER_SIP,
                          .args[0] = index,
                          .args[1] = paddr,
                          .args[2] = size,
                          .args[3] = cipher,
                          .args[4] = data_unit,
                          .args[5] = ce,
                          .arginfo = QCOM_SCM_ARGS(6, QCOM_SCM_VAL, QCOM_SCM_RW,
                                                  QCOM_SCM_VAL, QCOM_SCM_VAL,
                                                  QCOM_SCM_VAL, QCOM_SCM_VAL),
                  };

                  return qcom_scm_call_noretry(__scm->dev, &desc, NULL);
          }
          EXPORT_SYMBOL(qcom_scm_config_set_ice_key);

          int qcom_scm_clear_ice_key(uint32_t index, unsigned int ce)
          {
                  struct qcom_scm_desc desc = {
                          .svc = QCOM_SCM_SVC_ES,
                          .cmd = QCOM_SCM_ES_CLEAR_ICE_KEY,
                          .owner = ARM_SMCCC_OWNER_SIP,
                          .args[0] = index,
                          .args[1] = ce,
                          .arginfo = QCOM_SCM_ARGS(2),
                  };

                  return qcom_scm_call_noretry(__scm->dev, &desc, NULL);
          }
          EXPORT_SYMBOL(qcom_scm_clear_ice_key);

          int qcom_scm_derive_raw_secret(phys_addr_t paddr_key, size_t size_key,
                          phys_addr_t paddr_secret, size_t size_secret)
          {
                  struct qcom_scm_desc desc = {
                          .svc = QCOM_SCM_SVC_ES,
                          .cmd = QCOM_SCM_ES_DERIVE_RAW_SECRET,
                          .owner = ARM_SMCCC_OWNER_SIP
                  };

                  desc.args[0] = paddr_key;
                  desc.args[1] = size_key;
                  desc.args[2] = paddr_secret;
                  desc.args[3] = size_secret;
                  desc.arginfo = QCOM_SCM_ARGS(4, QCOM_SCM_RW, QCOM_SCM_VAL,
                                                  QCOM_SCM_RW, QCOM_SCM_VAL);
                  return qcom_scm_call_noretry(__scm->dev, &desc, NULL);
          }
          EXPORT_SYMBOL(qcom_scm_derive_raw_secret);
          SCMEOF
          # 4) minidump: msm_minidump_log_init() lived in minidump_log.c,
          #    which we dropped; delete the guarded call.
          sed -i '/^[[:space:]]*msm_minidump_log_init();$/d' drivers/soc/qcom/msm_minidump.c
          grep -n 'msm_minidump_log_init' drivers/soc/qcom/msm_minidump.c || echo '  log_init call removed'
          # 5) shm-bridge wrappers + KP init call: qtee_shmbridge.c (now part
          #    of qcom-scm.ko) needs qcom_scm_{enable,delete,create}_shm_bridge
          #    and scm_mem_protection_init_do, which exist only in the 5.15
          #    qcom_scm.c. 6.6 also renamed qcom_scm_call_noretry() to
          #    qcom_scm_call_atomic() - provide a compat wrapper. Extract the
          #    5.15 bodies from the cloned vermeer tree; add missing macros.
          for macro in QCOM_SCM_SVC_MP QCOM_SCM_MEMP_SHM_BRDIGE_CREATE \
                       QCOM_SCM_MEMP_SHM_BRIDGE_ENABLE QCOM_SCM_MEMP_SHM_BRIDGE_DELETE \
                       SCM_SVC_RTIC TZ_HLOS_NOTIFY_CORE_KERNEL_BOOTUP; do
            if ! grep -q "define $macro[[:space:]]" drivers/firmware/qcom_scm.h drivers/firmware/qcom_scm.c 2>/dev/null; then
              def=$(grep -rh "define $macro[[:space:]]" ../vermeer/drivers/firmware/ ../vermeer/include/ 2>/dev/null | head -n1)
              if [ -n "$def" ]; then
                sed -i "\$ i $def" drivers/firmware/qcom_scm.h
                echo "  macro added: $def"
              fi
            fi
          done
          grep -q 'linux/sched.h' drivers/firmware/qcom_scm.c || \
            sed -i '0,/#include/s//#include <linux\/sched.h>\n#include/' drivers/firmware/qcom_scm.c
          if ! grep -q 'int qcom_scm_call_noretry(' drivers/firmware/qcom_scm.c; then
            printf 'int qcom_scm_call_noretry(struct device *dev, struct qcom_scm_desc *desc,\n                        struct qcom_scm_res *res)\n{\n        return qcom_scm_call_atomic(dev, desc, res);\n}\nEXPORT_SYMBOL(qcom_scm_call_noretry);\n\n' >> drivers/firmware/qcom_scm.c
          fi
          for fname in qcom_scm_enable_shm_bridge qcom_scm_delete_shm_bridge \
                       qcom_scm_create_shm_bridge; do
            if ! grep -q "$fname(" drivers/firmware/qcom_scm.c; then
              awk -v fname="$fname" '
                $0 ~ "^[a-zA-Z_].*[^a-zA-Z0-9_]" fname "\\(" { inf=1 }
                inf { print }
                inf && /^}/ { seen=1; next }
                inf && seen && /^EXPORT_SYMBOL/ { print ""; exit }
                inf && seen && NF { exit }
              ' ../vermeer/drivers/firmware/qcom_scm.c >> drivers/firmware/qcom_scm.c
              echo "  $fname refs in qcom_scm.c now: $(grep -c "$fname" drivers/firmware/qcom_scm.c)"
            fi
          done
          # scm_mem_protection_init_do: awk extraction overran (the 5.15
          # function body has no clean terminator pattern); hand-write the
          # equivalent - it is only a KP bootup milestone SCM call whose
          # result qtee_shmbridge treats as a boolean.
          if ! grep -q 'scm_mem_protection_init_do(' drivers/firmware/qcom_scm.c; then
            printf 'int scm_mem_protection_init_do(void)\n{\n        struct qcom_scm_desc desc = {\n                .svc = SCM_SVC_RTIC,\n                .cmd = TZ_HLOS_NOTIFY_CORE_KERNEL_BOOTUP,\n                .owner = ARM_SMCCC_OWNER_SIP,\n                .arginfo = QCOM_SCM_ARGS(2),\n        };\n        struct qcom_scm_res res;\n\n        if (!__scm) {\n                pr_err("SCM dev is not initialized\\n");\n                return -1;\n        }\n        desc.args[0] = offsetof(struct task_struct, pid);\n        desc.args[1] = offsetof(struct task_struct, comm);\n        return qcom_scm_call(__scm->dev, &desc, &res);\n}\n\n' >> drivers/firmware/qcom_scm.c
          fi

      - name: Generate .config (gki_defconfig + vermeer fragment)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          curl -fsSL --retry 3 -o arch/arm64/configs/vendor/vermeer_GKI.config "$VERMEER_FRAGMENT_URL" 2>/dev/null || {
            mkdir -p arch/arm64/configs/vendor
            curl -fsSL --retry 3 -o arch/arm64/configs/vendor/vermeer_GKI.config "$VERMEER_FRAGMENT_URL"
          }
          make O=out ARCH=arm64 LLVM=1 gki_defconfig < /dev/null
          # make O=out writes the config to out/.config, but merge_config's
          # base must live in the source root. Copy it back first, otherwise
          # merge_config starts from an empty base and the gki_defconfig
          # settings (incl. CONFIG_MODULES=y) are lost, degrading every =m.
          cp out/.config .config
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/vermeer_GKI.config || true
          echo "=== PRE-OLDDEFCONFIG (.config right after merge) ==="
          grep -E '^CONFIG_(MODULES|ARCH_KALAMA|PINCTRL_KALAMA|QCOM_LLCC)=|^# CONFIG_(MODULES|ARCH_KALAMA)' .config || echo "  none of the key symbols present pre-olddefconfig"
          echo "pre =m entries: $(grep -c '=m$' .config || true)"
          mv .config out/.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig < /dev/null
          echo "=== POST-OLDDEFCONFIG ==="
          grep -E '^CONFIG_(MODULES|ARCH_KALAMA|PINCTRL_KALAMA|QCOM_LLCC)=|^# CONFIG_(MODULES|ARCH_KALAMA)' out/.config || echo "  none of the key symbols present post-olddefconfig"
          echo "post =m entries: $(grep -c '=m$' out/.config || true)"
          echo "=== kconfig knows ARCH_KALAMA? ==="
          grep -c 'source "arch/arm64/Kconfig.platforms"' arch/arm64/Kconfig || true
          grep -c 'config ARCH_KALAMA' arch/arm64/Kconfig.platforms || echo "  ARCH_KALAMA definition MISSING"
          echo "=== config entries ==="
          grep -c '^CONFIG' out/.config || true
          echo "=== driver options of interest ==="
          grep -E 'CONFIG_DRM_MSM|CONFIG_QCOM_|CONFIG_QCACLD|CONFIG_MSM_|CONFIG_QCOM_CAMSS|CONFIG_INTERCONNECT_QCOM' out/.config | head -n 30 || true
          echo "=== KEY SYMBOL SURVIVAL (post-merge olddefconfig) ==="
          echo "total =m entries: $(grep -c '=m$' out/.config || true)"
          for s in ARCH_KALAMA ARCH_CROW ARCH_KAKA PINCTRL_KALAMA PINCTRL_CROW PINCTRL_SM8550 GCC_KALAMA CAMCC_KALAMA DISPCC_KALAMA QCOM_LLCC QCOM_RPMH QCOM_AOSS MSM_QMP GUNYAH QCOM_HWSPINLOCK UFS_QCOM SDHCI_MSM CMD_DB; do
            v="$(grep -E "^CONFIG_${s}=" out/.config || grep -E "^# CONFIG_${s} " out/.config || echo "SYMBOL-LOST: ${s}")"
            echo "  $v"
          done

      - name: Build (collect errors, -k)
        env:
          LTO_MODE: ${{ inputs.lto || 'none' }}
          KEEP_GOING: ${{ inputs.keep_going && 'true' || 'false' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          echo "MARK-A cd ok, PWD=$(pwd)"
          bash ./scripts/config --file out/.config -d WERROR; echo "MARK-B werror rc=$?"
          case "$LTO_MODE" in
            thin) bash ./scripts/config --file out/.config -d LTO_NONE -e LTO_CLANG_THIN ;;
            full) bash ./scripts/config --file out/.config -d LTO_NONE -e LTO_CLANG_FULL ;;
            *) bash ./scripts/config --file out/.config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE ;;
          esac
          # GKI disables CONFIG_MODULE_UNLOAD, but the vermeer driver stack
          # (gunyah vm_mgr.c) references module_refcount() which only exists
          # when unloading is compiled in. Enable it.
          bash ./scripts/config --file out/.config -e MODULE_UNLOAD
          # 5.15-private rpmsg API (ept->rx_done etc.) was removed in 6.6 and
          # glink_pkt.ko is not in the official vermeer module list: skip it.
          bash ./scripts/config --file out/.config -d QCOM_GLINK_PKT
          # The 5.15 BSP clock drivers (gcc/camcc/dispcc/tcsrcc/video/debugcc-
          # kalama) depend on Qualcomm's private vdd-regulator header stack,
          # which does not exist in 6.6. Use the upstream sm8550 clock drivers
          # instead - they match the same DTB clock node compatibles.
          bash ./scripts/config --file out/.config \
            -d SM_GCC_KALAMA -d SM_CAMCC_KALAMA -d SM_DISPCC_KALAMA \
            -d SM_TCSRCC_KALAMA -d SM_VIDEOCC_KALAMA -d SM_DEBUGCC_KALAMA
          bash ./scripts/config --file out/.config \
            -m SM_GCC_8550 -m SM_CAMCC_8550 -m SM_DISPCC_8550 \
            -m SM_GPUCC_8550 -m SM_VIDEOCC_8550 || true
          # 5.15 pmic_glink client struct differs from 6.6's; battery debug
          # is not in the official vermeer module list - skip it.
          bash ./scripts/config --file out/.config -d QTI_BATTERY_GLINK_DEBUG
          # Same 5.15 pmic_glink client-data layout, same reasoning: the
          # charger-ulog and altmode glink clients are debug facilities that
          # are not in the official vermeer module list - skip them too.
          bash ./scripts/config --file out/.config \
            -d QTI_CHARGER_ULOG_GLINK -d QTI_ALTMODE_GLINK
          # ... and the spmi glink debug client - same story.
          bash ./scripts/config --file out/.config -d SPMI_QTI_GLINK_DEBUG
          # minidump_memory.c (the panic-dump collector of the minidump set)
          # needs 5.15-private MM internals (struct track.addrs, dma_resv
          # seq/fence, slab internals, ADS_* symbols, PAGE_OWNER); it is a
          # panic-time debug feature - drop it from the minidump set.
          bash ./scripts/config --file out/.config -d QCOM_MINIDUMP_PANIC_DUMP
          # qcom_iommu_util (official module list member) is the 5.15
          # fast-pgtable/lazy-mapping IOMMU performance layer; porting it
          # would mean porting the whole 5.15 IOMMU core API (which 6.6
          # restructured around iommu_domain_ops) and would break the
          # already-working 6.6 arm-smmu. Base mapping is provided by
          # arm-smmu; disable the accelerator and document the loss.
          bash ./scripts/config --file out/.config -d QCOM_IOMMU_UTIL
          # qcom_esoc (external-modem framework) is not on vermeer's official
          # module list and its mdm-pon members need 5.15-private headers;
          # SM8550 has no external MDM modem. Disable.
          bash ./scripts/config --file out/.config -d QCOM_ESOC
          # The 5.15 kalama.c interconnect platform driver uses the 5.15
          # qcom_icc_node layout (noc_ops/qosbox) which 6.6 restructured.
          # Use the upstream sm8550.c platform driver instead (same as the
          # upstream clock switch above); icc-rpmh/bcm-voter already build.
          bash ./scripts/config --file out/.config -d INTERCONNECT_QCOM_KALAMA
          bash ./scripts/config --file out/.config -m INTERCONNECT_QCOM_SM8550
          # crow.c / kaka.c are the same 5.15-layout platform drivers for
          # other SoCs (not vermeer); they hit the same icc_node rework.
          bash ./scripts/config --file out/.config -d INTERCONNECT_QCOM_CROW
          bash ./scripts/config --file out/.config -d INTERCONNECT_QCOM_KAKA
          # modpost: these 5.15 modules (none on the official list) reference
          # 5.15-private symbols (qcom_scm_assign_mem_regions,
          # qtee_shmbridge_*, subsystem_sleep_debug_enable,
          # register_trace_android_rvh_do_undefinstr/..._do_ptrauth_fault)
          # that do not exist in the 6.6 tree. Disable them.
          # QCOM_SECURE_BUFFER / QCOM_WDT_CORE / QCOM_MEMORY_DUMP_V2 re-enabled:
          # their qcom_scm deps are now ported (fix 56 extraction above).
          bash ./scripts/config --file out/.config -d QTI_SYS_PM_VX
          bash ./scripts/config --file out/.config -d QCOM_CPU_VENDOR_HOOKS
          # The 5.15 mem-hooks/mem-offline drivers depend on Qualcomm's
          # private 5.15 MM internals (mkswapd array, MAX_KSWAPD_THREADS)
          # that do not exist in 6.6 MM: skip them.
          bash ./scripts/config --file out/.config \
            -d QCOM_MEM_HOOKS -d QCOM_MEM_OFFLINE
          # llcc_perfmon uses the 5.15 llcc_drv_data layout (single regmap,
          # llcc_ver, offsets); 6.6 upstream restructured it to regmaps[] -
          # perfmon is a debug facility, not in the official module list.
          bash ./scripts/config --file out/.config -d QCOM_LLCC_PERFMON
          # core_hang_detect touches bus_type.dev_root, removed in 6.6; it
          # is a debug facility not in the official vermeer module list.
          bash ./scripts/config --file out/.config -d MSM_CORE_HANG_DETECT
          # qdss_bridge uses the 5.15-private MHI API (MHI_MAX_MTU, two-arg
          # mhi calls); it is a debug facility not in the official list.
          bash ./scripts/config --file out/.config -d QCOM_QDSS_BRIDGE
          # In 5.15 the QTI_HW_KEY_MANAGER_V1 inline stubs and the real
          # crypto-qti-hwkm functions are mutually exclusive; after the
          # merge both got enabled and collide. Keep the real driver
          # (official module list member), drop the V1 stubs.
          bash ./scripts/config --file out/.config -d QTI_HW_KEY_MANAGER_V1
          # CONFIG_QTI_CRYPTO_COMMON gates crypto-qti-platform.h between real
          # declarations and -EOPNOTSUPP stubs; if it gets dropped at
          # olddefconfig the stubs collide with the real hwkm functions.
          # Force it on (it is also an official module: crypto-qti-common).
          bash ./scripts/config --file out/.config -m QTI_CRYPTO_COMMON  # must stay =m: built-in common would reference modular hwkm symbols
          # Batch: every soc/qcom target that is fragment=m, NOT in the
          # official vermeer module list, and built on 5.15-private
          # frameworks (sleep-stats collectors, dump collectors, BAM/SPS
          # DMA, slate/tmecom, panel event, hung-task enh, etc). Skipping
          # all of them does not reduce official module coverage.
          bash ./scripts/config --file out/.config \
            -d QCOM_CPUSS_SLEEP_STATS -d MEM_SHARE_QMI_SERVICE \
            -d QCOM_SMP2P_SLEEPSTATE -d QSEE_IPC_IRQ_BRIDGE -d QCOM_GLINK \
            -d QCOM_CDSP_RM -d QCOM_SYSMON_SUBSYSTEM_STATS \
            -d QCOM_SUBSYSTEM_SLEEP_STATS -d QCOM_SOC_SLEEP_STATS \
            -d QCOM_ADSP_SLEEPMON -d QCOM_MICRODUMP \
            -d MSM_CDSP_LOADER -d QTI_PMIC_PON_LOG -d MSM_BOOT_STATS \
            -d QCOM_RUN_QUEUE_STATS -d USB_BAM -d QCOM_DCVS -d QTI_RIMPS_LOG \
            -d QCOM_RAMDUMP -d QCOM_PANEL_EVENT_NOTIFIER \
            -d QCOM_VM_DMESG_DUMPER -d QCOM_FSA4480_I2C \
            -d SHOW_SUSPEND_EPOCH -d GH_TLMM_VM_MEM_ACCESS -d SPS \
            -d MSM_PERFORMANCE -d QCOM_VA_MINIDUMP -d MSM_QBT_HANDLER \
            -d QCOM_HUNG_TASK_ENH
          # 6) secure-buffer chain: secure_buffer.ko, qcom_wdt_core.ko and
          # memory_dump_v2.ko (all official) need qcom_scm_assign_mem_regions /
          # sec_wdog_deactivate / assign_dump_table_region. Extract them (plus
          # the __qcom_scm_assign_mem helper and the two structs they use)
          # from the 5.15 tree, then re-enable the three modules.
          for macro in QCOM_SCM_BOOT_SEC_WDOG_DIS QCOM_SCM_UTIL_DUMP_TABLE_ASSIGN \
                       QCOM_SCM_SVC_BOOT QCOM_SCM_SVC_UTIL; do
            if ! grep -q "define $macro[[:space:]]" drivers/firmware/qcom_scm.h drivers/firmware/qcom_scm.c 2>/dev/null; then
              def=$(grep -rh "define $macro[[:space:]]" ../vermeer/drivers/firmware/ ../vermeer/include/ 2>/dev/null | head -n1)
              if [ -n "$def" ]; then
                sed -i "\$ i $def" drivers/firmware/qcom_scm.h
                echo "  macro added: $def"
              fi
            fi
          done
          if ! grep -q 'struct qcom_scm_mem_map_info {' include/linux/qcom_scm.h; then
            awk '/^struct qcom_scm_mem_map_info {/,/^};/' ../vermeer/include/linux/qcom_scm.h > /tmp/scmstructs.h
            awk '/^struct qcom_scm_current_perm_info {/,/^};/' ../vermeer/include/linux/qcom_scm.h >> /tmp/scmstructs.h
            printf '\nextern int qcom_scm_sec_wdog_deactivate(void);\nextern int qcom_scm_assign_dump_table_region(bool is_assign, phys_addr_t addr, size_t size);\nextern int qcom_scm_assign_mem_regions(struct qcom_scm_mem_map_info *mem_regions, size_t mem_regions_sz, u32 *srcvms, size_t src_sz, struct qcom_scm_current_perm_info *newvms, size_t newvms_sz);\n\n' >> /tmp/scmstructs.h
            sed -i '/^#endif \/\* __QCOM_SCM_H \*\/$/e cat /tmp/scmstructs.h' include/linux/qcom_scm.h
            grep -c 'qcom_scm_mem_map_info' include/linux/qcom_scm.h
          fi
          for fname in __qcom_scm_assign_mem qcom_scm_sec_wdog_deactivate \
                       qcom_scm_assign_dump_table_region qcom_scm_assign_mem_regions; do
            if ! grep -q "$fname(" drivers/firmware/qcom_scm.c; then
              awk -v fname="$fname" '
                $0 ~ "^[a-zA-Z_].*[^a-zA-Z0-9_]" fname "\\(" { inf=1 }
                inf { print }
                inf && /^}/ { seen=1; next }
                inf && seen && /^EXPORT_SYMBOL/ { print ""; exit }
                inf && seen && NF { exit }
              ' ../vermeer/drivers/firmware/qcom_scm.c >> drivers/firmware/qcom_scm.c
              echo "  $fname refs now: $(grep -c "$fname" drivers/firmware/qcom_scm.c)"
            fi
          done

          # Upstream replacements for 5.15-private thermal/watchdog drivers
          # (qcom_tsens/qcom_wdt_core are not portable; the upstream SM8550
          # capable drivers must be enabled or thermal protection is blind).
          bash ./scripts/config --file out/.config -e NVMEM_QCOM_QFPROM -e QCOM_TSENS -e QCOM_WDT
          # Camera phase 0: upstream camss has SM8550 support (vfe-480 +
          # csiphy-3ph). QTI camera-kernel is closed everywhere (verified:
          # MiCode vermeer/fuxi, OnePlusOSS sm8550 all lack it), so camss +
          # libcamera is the only route. cci = camera I2C master.
          bash ./scripts/config --file out/.config -m VIDEO_QCOM_CAMSS -m I2C_QCOM_CCI -m SM_CAMCC_8550 -m VIDEO_OV50E
          make O=out ARCH=arm64 LLVM=1 olddefconfig < /dev/null
          KFLAG=""
          [ "$KEEP_GOING" = "true" ] && KFLAG="-k"
          find . -not -path './out*' -exec touch -d @0 {} + 2>/dev/null || true
          make $KFLAG -j"$(nproc)" O=out ARCH=arm64 LLVM=1 \
               KCFLAGS='-Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=strict-prototypes -Wno-error=int-conversion' \
               Image modules < /dev/null 2>&1 | tee -a build.log || build_failed=1
          # Camera test DTB: build standalone so a dts error never blocks
          # the kernel build; keep the full log in diag for inspection.
          make O=out ARCH=arm64 LLVM=1 qcom/sm8550-vermeer-camss-test.dtb > dtb-build.log 2>&1 || true
          tail -n 30 dtb-build.log
          ls -lh out/arch/arm64/boot/dts/qcom/sm8550-vermeer-camss-test.dtb 2>/dev/null || echo "NO TEST DTB"
          echo "=== build output ==="
          ls -lh out/arch/arm64/boot/Image 2>/dev/null || echo "NO IMAGE"
          find out -name '*.ko' 2>/dev/null | wc -l
          if [ "${build_failed:-0}" = "1" ]; then
            echo "BUILD FAILED - collecting error digest"
            grep -E 'error:|Error [0-9]' build.log | sort | uniq -c | sort -rn | head -n 60 > errors-digest.txt || true
            cat errors-digest.txt || true
            echo "=== first 40 error contexts ==="
            grep -n -m 40 -E 'error:|Error [0-9]' build.log || true
            exit 1
          fi

      # NOTE: no build-tree cache here. An orphan port-66-out-* cache from an
      # early workflow revision poisoned packaged artifacts (post-build restore
      # overwrote out/.config with a stale 2421-line MODULES=n config).

      - name: Package port output (Image + modules + match report)
        if: always()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel"
          A="../port-out"
          rm -rf "$A" && mkdir -p "$A"
          cp out/arch/arm64/boot/Image "$A/" 2>/dev/null || echo "NO IMAGE"
          cp out/System.map "$A/" 2>/dev/null || true
          cp out/.config "$A/kernel.config" 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/sm8550-vermeer-camss-test.dtb "$A/" 2>/dev/null || true
          find out -name '*.ko' | while read -r k; do
            rel="${k#out/}"
            mkdir -p "$A/$(dirname "$rel")"
            cp "$k" "$A/$rel"
          done
          echo "=== packaged .ko files: $(find "$A" -name '*.ko' | wc -l) ==="
          if curl -fsSL --retry 3 -o /tmp/vermeer-ml "$VERMEER_MODULE_LIST_URL" 2>/dev/null; then
            find out -name '*.ko' -printf '%f\n' | sort -u > /tmp/built
            grep -v '^#' /tmp/vermeer-ml | grep -v '^$' | sed 's/\.ko$//' | sort > /tmp/want
            echo "=== official vermeer module list: $(wc -l < /tmp/want) entries; built unique modules: $(wc -l < /tmp/built) ==="
            sed 's/\.ko$//' /tmp/built | sort > /tmp/builtbase
            echo "--- MATCHED (official list module that got built): $(comm -12 /tmp/want /tmp/builtbase | wc -l) ---"
            comm -12 /tmp/want /tmp/builtbase > "$A/modules-matched.txt"
            echo "--- MISSING (official list module NOT built): $(comm -23 /tmp/want /tmp/builtbase | wc -l) ---"
            comm -23 /tmp/want /tmp/builtbase > "$A/modules-missing.txt"
            cat "$A/modules-missing.txt" || true
          else
            echo "official module list fetch failed"
          fi
        env:
          VERMEER_MODULE_LIST_URL: https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/bsp-vermeer-t-oss/modules.list.msm.vermeer

      - name: Upload port output (Image + modules)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-output-${{ github.run_id }}
          path: port-out
          if-no-files-found: warn
          retention-days: 14

      - name: Upload diagnostics (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-diag-${{ github.run_id }}
          path: |
            kernel/build.log
            kernel/errors-digest.txt
            kernel/dtb-build.log
            kernel/out/.config
            kernel/out/arch/arm64/boot/dts/qcom/sm8550-vermeer-camss-test.dtb
          if-no-files-found: warn
